<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PDF Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Use your site-wide styles -->
  <link rel="stylesheet" href="../styles.css" />
  <!-- jsPDF (client-side PDF) -->
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <style>
    /* Layout card to match your futuristic dark theme */
    .container {
      max-width: 900px;
      margin: 3rem auto;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      backdrop-filter: blur(6px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    .page-title {
      font-family: 'Anton', sans-serif;
      font-size: 2.4rem;
      color: #00ffcc; /* matches site accent */
      margin: 0 0 1.25rem 0;
      letter-spacing: 0.5px;
      text-shadow: 0 0 18px rgba(0,255,204,0.25);
    }

    /* Bright red gradient back button */
    .back-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin: 2rem auto 1rem;
      max-width: 900px;
      padding: 0 0.5rem;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 1.25rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: #fff;
      background: linear-gradient(135deg, #ff2742 0%, #ff0037 40%, #b00020 100%);
      box-shadow: 0 8px 24px rgba(255, 0, 72, 0.45), inset 0 0 0 1px rgba(255,255,255,0.12);
      transition: transform 0.12s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }
    .btn-back:hover { transform: translateY(-1px); filter: brightness(1.05); }
    .btn-back:active { transform: translateY(0); filter: brightness(0.96); }

    /* Form */
    form {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.2rem;
    }
    label {
      font-weight: 700;
      color: #e5fff8;
      letter-spacing: 0.3px;
    }
    input[type="text"], textarea {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      border-radius: 10px;
      padding: 0.9rem 1rem;
      font-size: 1rem;
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
    }
    input[type="text"]::placeholder,
    textarea::placeholder { color: #a0a0a0; }

    textarea { min-height: 260px; resize: vertical; }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
      margin-top: 0.5rem;
    }

    .btn-export {
      position: relative;
      overflow: hidden;
      border: none;
      cursor: pointer;
      padding: 0.95rem 1.3rem;
      border-radius: 12px;
      background: linear-gradient(135deg, #00ffcc, #00ccaa);
      color: #00110d;
      font-weight: 900;
      letter-spacing: 0.4px;
      transition: transform 0.12s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 28px rgba(0,255,204,0.22);
    }
    .btn-export:hover { transform: translateY(-1px); }
    .btn-export:active { transform: translateY(0); }

    /* Laser-style loading bar overlay */
    .loading-wrap {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: radial-gradient(1200px 600px at 50% -10%, rgba(0,255,204,0.075), rgba(0,0,0,0.7) 60%), rgba(0,0,0,0.55);
      z-index: 9999;
      backdrop-filter: blur(3px);
    }
    .loading {
      width: min(720px, 86vw);
      padding: 1.2rem 1.2rem 1.4rem;
      border-radius: 14px;
      background: rgba(17,17,17,0.85);
      border: 1px solid rgba(255,255,255,0.09);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05) inset;
      text-align: center;
    }
    .loading h3 {
      margin: 0 0 0.8rem 0;
      color: #eafffa;
      letter-spacing: 0.4px;
    }
    .bar {
      position: relative;
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .bar::before {
      content: "";
      position: absolute;
      inset: 0;
      width: 0%;
      background:
        linear-gradient(90deg, rgba(255,0,86,0.1), rgba(255,0,86,0.2)),
        repeating-linear-gradient(90deg, rgba(255,80,120,0.5) 0 10px, rgba(255,0,86,0.8) 10px 20px);
      box-shadow:
        0 0 12px rgba(255, 0, 110, 0.6),
        0 0 24px rgba(255, 0, 110, 0.5),
        0 0 48px rgba(255, 0, 110, 0.3);
      animation: fill 1s cubic-bezier(.2,.7,.2,1) forwards, sheen 0.8s linear infinite;
    }
    @keyframes fill { to { width: 100%; } }
    @keyframes sheen {
      0%   { filter: drop-shadow(0 0 6px rgba(255,0,110,0.9)); }
      50%  { filter: drop-shadow(0 0 16px rgba(255,0,110,1)); }
      100% { filter: drop-shadow(0 0 6px rgba(255,0,110,0.9)); }
    }
    .loading small { display: block; margin-top: 0.7rem; color: #a9fff0; opacity: 0.9; }
  </style>
</head>
<body>
  <!-- Back + Title -->
  <div class="back-row">
    <a class="btn-back" href="../">
      <!-- simple chevron -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 6l-6 6 6 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back to Home
    </a>
  </div>

  <main class="container">
    <h1 class="page-title">PDF Generator</h1>

    <form id="pdfForm">
      <div>
        <label for="title">Title</label>
        <input id="title" type="text" placeholder="Enter the PDF title…" autocomplete="off" />
      </div>

      <div>
        <label for="text">Text</label>
        <textarea id="text" placeholder="Paste your multi-line text here… One input line = one PDF line."></textarea>
      </div>

      <div class="actions">
        <button id="exportBtn" type="submit" class="btn-export">Export PDF</button>
      </div>
    </form>
  </main>

  <!-- Loading overlay -->
  <div class="loading-wrap" id="loading">
    <div class="loading">
      <h3>Generating PDF</h3>
      <div class="bar"></div>
      <small>Laser-speed render in progress…</small>
    </div>
  </div>

  <script>
    // Utilities
    function sanitizeFilename(name) {
      // Remove forbidden filename characters: \ / : * ? " < > | and trim
      return (name || "document")
        .replace(/[\\\/:\*\?"<>\|]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function showLoading(show) {
      const el = document.getElementById('loading');
      el.style.display = show ? 'flex' : 'none';
    }

    // PDF Generation
    async function generatePDF({ title, text }) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'pt', format: 'a4' }); // points for precise line heights
      const page = {
        width: doc.internal.pageSize.getWidth(),
        height: doc.internal.pageSize.getHeight(),
        marginX: 56,           // ~0.78in margin
        marginY: 56
      };

      const bodyFontSize = 12;     // default body font
      const minFontSize = 8;       // minimum to squeeze long lines
      const lineHeight = 18;       // line height for "rows"
      const titleSize = 26;        // big bold title

      let x = page.marginX;
      let y = page.marginY;

      // 8 empty rows
      y += lineHeight * 8;

      // Title
      if (title && title.trim().length) {
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(titleSize);
        doc.text(title.trim(), x, y);
      }
      // 2 empty rows
      y += lineHeight * 2;

      // Text lines (one input line => one printed line)
      const lines = (text || '').replace(/\r\n/g, '\n').split('\n');

      doc.setFont('helvetica', 'normal'); // reset for body

      for (let i = 0; i < lines.length; i++) {
        // Page break if needed *before* writing
        if (y > page.height - page.marginY) {
          doc.addPage();
          y = page.marginY;
        }

        let line = lines[i].replace(/\t/g, '    ');
        // Fit line into one visual line by scaling font size down if it’s too long
        doc.setFontSize(bodyFontSize);
        let size = bodyFontSize;
        const maxWidth = page.width - page.marginX * 2;
        let width = doc.getTextWidth(line);

        if (width > maxWidth) {
          // shrink proportionally but clamp to minFontSize
          const scaled = Math.max(minFontSize, Math.floor(bodyFontSize * (maxWidth / width)));
          doc.setFontSize(scaled);
        }

        doc.text(line, x, y);
        y += lineHeight; // next "row"
      }

      const filename = sanitizeFilename(title) + ".pdf";
      doc.save(filename);
    }

    // Wire up form
    document.getElementById('pdfForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const exportBtn = document.getElementById('exportBtn');
      const title = document.getElementById('title').value;
      const text = document.getElementById('text').value;

      exportBtn.disabled = true;
      showLoading(true);

      // 1-second laser bar animation
      setTimeout(async () => {
        try {
          await generatePDF({ title, text });
        } catch (err) {
          console.error(err);
          alert('Sorry, something went wrong while generating the PDF.');
        } finally {
          showLoading(false);
          exportBtn.disabled = false;
        }
      }, 1000);
    });
  </script>
</body>
</html>
