<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JSON Formatter</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Roboto Mono', monospace;
      background-color: #0f0f0f;
      color: #fff;
      padding: 2rem;
      background-image: radial-gradient(#333 1px, transparent 1px);
      background-size: 20px 20px;
    }
    h2 {
      text-align: center;
      font-size: 2rem;
      color: #00ffcc;
      margin-bottom: 2rem;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      align-items: flex-start;
    }
    textarea {
      width: 100%;
      max-width: 600px;
      height: 300px;
      font-family: 'Roboto Mono', monospace;
      font-size: 14px;
      padding: 15px;
      box-sizing: border-box;
      background-color: #1e1e1e;
      color: #00ffcc;
      border: 2px solid #00ffcc;
      border-radius: 8px;
      transition: all 0.3s ease;
    }
    /* UUSI: JSON-katselin */
    .json-output {
      position: relative; /* for copy button placement */
      width: 100%;
      max-width: 600px;
      min-height: 300px;
      box-sizing: border-box;
      background-color: #1e1e1e;
      border: 2px solid #00ffcc;
      border-radius: 8px;
      padding: 12px 14px;
      overflow: auto;
      font-size: 14px;
      line-height: 1.4;
      opacity: 0;
      transform: translateY(10px);
      transition: all 1s ease;
    }
    .json-output.visible {
      opacity: 1;
      transform: translateY(0);
    }
    /* Värit ja typografia */
    .k { color: #ffcc66; }   /* avain */
    .s { color: #a6e22e; }   /* string */
    .n { color: #66d9ef; }   /* number */
    .b { color: #ff6; }      /* boolean */
    .nl{ color: #f92672; }   /* null */
    .meta { color:#00ccff; opacity:.9; } /* { } / [ ] tiivistelmä */

    /* details/summary tyylit */
    details { margin-left: 16px; }
    summary {
      cursor: pointer;
      list-style: none;
      position: relative;
      padding-left: 16px;
      user-select: none;
    }
    /* Nuolikolmio */
    summary::before {
      content: "▶";
      position: absolute;
      left: 0;
      top: 0;
      transform: translateY(1px) rotate(0deg);
      transition: transform .15s ease;
      font-size: 10px;
      color: #00ffcc;
    }
    details[open] > summary::before {
      transform: translateY(1px) rotate(90deg);
    }
    /* Rivit */
    .line { white-space: pre-wrap; margin: 2px 0; }
    .sep { color:#888; } /* : ja , */
    .buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    button, .home-btn {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      text-align: center;
      display: inline-block;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button {
      background: linear-gradient(90deg, #00ffcc, #00ccff);
      color: #000;
      box-shadow: 0 0 10px #00ffcc;
    }
    button:hover { transform: scale(1.05); box-shadow: 0 0 20px #00ffcc; }
    .home-btn {
      background: linear-gradient(90deg, #ff0066, #ff6600);
      color: #fff;
      box-shadow: 0 0 10px #ff0066;
    }
    .home-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px #ff0066; }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background-color: #00cc88; color: white; padding: 12px 20px; border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3); font-size: 14px; opacity: 0; pointer-events: none;
      transition: opacity 0.5s ease; z-index: 1000;
    }
    .toast.show { opacity: 1; }
    .toast.error { background-color: #ff0033; }

    /* Copy button inside output */
    .copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: linear-gradient(90deg,#00ffcc,#00ccff);
      color: #002;
      font-size: 18px;
      border: none;
      box-shadow: 0 6px 18px rgba(0,255,204,0.08), 0 2px 6px rgba(0,0,0,0.5);
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease, opacity .12s ease;
      z-index: 10;
    }
    .copy-btn:focus { outline: 2px solid #00ffcc; }
    .copy-btn:hover { transform: translateY(-3px) scale(1.03); filter: brightness(1.07); box-shadow: 0 10px 30px rgba(0,204,255,0.18); }

    /* tooltip that appears on hover */
    .copy-btn .tooltip {
      position: absolute;
      top: -36px;
      right: 0;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      background: #111;
      color: #fff;
      white-space: nowrap;
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
      transition: opacity .12s ease, transform .12s ease;
    }
    .copy-btn:hover .tooltip,
    .copy-btn:focus .tooltip {
      opacity: 1;
      transform: translateY(0);
    }

    .copy-btn.copied { animation: pop .28s ease; }
    @keyframes pop { 0%{ transform: scale(1);} 50%{ transform: scale(1.12);} 100%{ transform: scale(1);} }

    @media (min-width: 768px) {
      textarea { width: 45%; }
      .json-output { width: 45%; }
    }
  </style>
</head>
<body>

<h2>JSON Formatter</h2>

<div class="container">
  <textarea id="input" placeholder="Liitä URL-koodattu JSON tähän..."></textarea>
  <!-- MUUTOS: textarea -> div katselimeksi -->
  <div id="output" class="json-output" aria-live="polite" role="region"></div>
</div>

<div class="buttons">
  <button id="convertBtn">Prettify JSON</button>
  <a href="/" class="home-btn">← Takaisin kotiin</a>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
  const STORAGE_KEY = 'jsonFormatter.input';
  const input = document.getElementById('input');
  const output = document.getElementById('output');
  const button = document.getElementById('convertBtn');
  const toast = document.getElementById('toast');

  function showToast(message, isError = false) {
    toast.textContent = message;
    toast.className = 'toast' + (isError ? ' error' : '');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  function showAnimatedOutput(node) {
    output.classList.remove('visible');
    output.replaceChildren(); // tyhjennä
    setTimeout(() => {
      output.appendChild(node);
      output.classList.add('visible');
    }, 50);
  }

  // ===== debounce helper =====
  function debounce(fn, wait = 250) {
    let t;
    return (...args) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...args), wait);
    };
  }

  // ===== JSON -> DOM (collapsable) =====
  function renderJSON(value, keyLabel) {
    const span = (cls, text) => {
      const el = document.createElement('span');
      el.className = cls;
      el.textContent = text;
      return el;
    };

    if (value === null) return span('nl', 'null');

    const type = typeof value;
    if (type === 'string') return span('s', `"${value}"`);
    if (type === 'number') return span('n', String(value));
    if (type === 'boolean') return span('b', String(value));

    const isArray = Array.isArray(value);
    const keys = isArray ? value.map((_, i) => i) : Object.keys(value);

    const details = document.createElement('details');
    details.open = true;

    const summary = document.createElement('summary');
    const wrapper = document.createElement('span');
    wrapper.className = 'meta';

    const bracketOpen = isArray ? '[' : '{';
    const bracketClose = isArray ? ']' : '}';
    const labelText = isArray
            ? `${bracketOpen} Array · ${keys.length} ${keys.length === 1 ? 'item' : 'items'} ${bracketClose}`
            : `${bracketOpen} Object · ${keys.length} ${keys.length === 1 ? 'key' : 'keys'} ${bracketClose}`;

    if (keyLabel !== undefined) {
      const keySpan = document.createElement('span');
      keySpan.className = 'k';
      keySpan.textContent = keyLabel;
      summary.appendChild(keySpan);
      summary.appendChild(span('sep', ': '));
    }

    wrapper.textContent = labelText;
    summary.appendChild(wrapper);
    details.appendChild(summary);

    keys.forEach((k) => {
      const line = document.createElement('div');
      line.className = 'line';

      if (isArray) {
        const idx = document.createElement('span');
        idx.className = 'k';
        idx.textContent = `[${k}]`;
        line.appendChild(idx);
        line.appendChild(span('sep', ': '));
        line.appendChild(renderJSON(value[k]));
      } else {
        const keySpan = document.createElement('span');
        keySpan.className = 'k';
        keySpan.textContent = k;
        line.appendChild(keySpan);
        line.appendChild(span('sep', ': '));
        line.appendChild(renderJSON(value[k]));
      }
      details.appendChild(line);
    });

    return details;
  }

  // Create copy button element (inserted into output)
  function createCopyButton() {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'copy-btn';
    btn.setAttribute('aria-label', 'Copy to Clipboard');
    btn.title = 'Copy to Clipboard';

    // SVG icon (copy)
    btn.innerHTML = `📎<span class="tooltip">Copy to Clipboard</span>`;

    // click handler
    btn.addEventListener('click', async (e) => {
      e.preventDefault();
      const pretty = output.dataset.json;
      if (!pretty) {
        showToast('Ei kopoitavaa JSONia. Muunna ensin.', true);
        return;
      }

      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(pretty);
        } else {
          // fallback
          const ta = document.createElement('textarea');
          ta.value = pretty;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }

        // visual feedback: tooltip and tiny pop animation
        const tooltip = btn.querySelector('.tooltip');
        if (tooltip) tooltip.textContent = 'Copied!';
        btn.classList.add('copied');
        showToast('JSON kopioitu leikepöydälle!');
        setTimeout(() => {
          if (tooltip) tooltip.textContent = 'Copy to Clipboard';
          btn.classList.remove('copied');
        }, 1400);
      } catch (err) {
        showToast('Kopio epäonnistui.', true);
        console.error('copy failed', err);
      }
    });

    return btn;
  }

  function parseAndRender(encoded) {
    // clear stored json unless we successfully parse
    output.dataset.json = '';

    if (!encoded) {
      showAnimatedOutput(document.createTextNode('Liitä ensin URL-koodattu JSON!'));
      showToast('Tyhjä syöte. Liitä JSON ensin.', true);
      return;
    }

    if (encoded.startsWith('params=')) encoded = encoded.substring(7);

    try {
      const decoded = decodeURIComponent(encoded);
      const json = JSON.parse(decoded);
      const tree = renderJSON(json);

      // store prettified JSON so copy button can use it
      output.dataset.json = JSON.stringify(json, null, 2);

      // create wrapper so we can position copy button (keeps tree intact)
      const wrapper = document.createElement('div');
      wrapper.style.position = 'relative';
      wrapper.appendChild(tree);

      // always attach a fresh copy button into wrapper (avoids disappearing when output gets cleared)
      const copyBtn = createCopyButton();
      wrapper.appendChild(copyBtn);

      showAnimatedOutput(wrapper);
      showToast('Valmis!');
    } catch (err) {
      output.dataset.json = '';
      const errorEl = document.createElement('div');
      errorEl.textContent = 'Virhe: ' + err.message;
      showAnimatedOutput(errorEl);
      showToast('JSON ei ole kelvollinen!', true);
    }
  }

  // --- persist input to localStorage (debounced) ---
  const saveInput = debounce(() => {
    try {
      localStorage.setItem(STORAGE_KEY, input.value || '');
    } catch (e) {
      console.warn('Could not save input to localStorage', e);
    }
  }, 200);
  input.addEventListener('input', saveInput);

  // Restore on load
  document.addEventListener('DOMContentLoaded', () => {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        input.value = saved;
        // auto render previous content so the UI "remembers"
        parseAndRender(input.value.trim());
      }
    } catch (e) {
      console.warn('localStorage read failed', e);
    }
  });

  // Save and parse when user clicks the Prettify button
  button.addEventListener('click', () => {
    // ensure saved immediately
    try { localStorage.setItem(STORAGE_KEY, input.value || ''); } catch(e){}
    parseAndRender(input.value.trim());
  });
</script>

</body>
</html>
