<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hardest – Card Gallery</title>
  <link rel="stylesheet" href="../../styles.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="/components/topbar.css">
  <script src="/components/topbar.js" defer></script>
  <link rel="stylesheet" href="/components/footer.css">
  <script src="/components/footer.js" defer></script>
</head>
<body>
<rk-topbar title="Hardest – Card Gallery"></rk-topbar>

<!-- Filters: 10 controls -->
<section class="filters">
  <div class="filters-wrap" id="filters">
    <div>
      <label for="f-name">Name</label>
      <input id="f-name" type="text" placeholder="Search name" />
    </div>
    <div>
      <label for="f-keywords">Keywords</label>
      <input id="f-keywords" type="text" placeholder="e.g. buried, pair" />
    </div>
    <div>
      <label for="f-type">Type</label>
      <select id="f-type">
        <option value="">Any</option>
        <option>Rock</option>
        <option>Paper</option>
        <option>Scissor</option>
        <option>Gun</option>
        <option>Mimic</option>
        <option>God</option>
        <option>Bedrock</option>
        <option>Zipper</option>
        <option>Rockstar</option>
        <option>Multi</option>
      </select>
    </div>
    <div>
      <label for="f-house">House</label>
      <select id="f-house">
        <option value="">Any</option>
        <option>Champion</option>
        <option>Delusional</option>
        <option>Demonic</option>
        <option>Divine</option>
        <option>Hightech</option>
        <option>Kawaii</option>
        <option>God</option>
        <option>Scam</option>
      </select>
    </div>
    <div>
      <label for="f-rarity">Rarity</label>
      <select id="f-rarity">
        <option value="">Any</option>
        <option>Common</option>
        <option>Rare</option>
        <option>Super-rare</option>
        <option>Short-printed</option>
      </select>
    </div>
    <div>
      <label for="f-releaseVersion">Release Version</label>
      <select id="f-releaseVersion">
        <option value="">Any</option>
        <option>v0.7</option>
        <option>v0.8</option>
        <option>v0.9</option>
        <option>v0.10</option>
        <option>v0.11</option>
        <option>v0.12</option>
      </select>
    </div>
    <div>
      <label for="f-releaseYear">Release Year</label>
      <select id="f-releaseYear">
        <option value="">Any</option>
        <option>2025</option>
      </select>
    </div>
    <div>
      <label for="f-orderBy">Order By</label>
      <select id="f-orderBy">
        <option value="newest">Newest</option>
        <option value="name">Name</option>
        <option value="type">Type</option>
        <option value="house">House</option>
        <option value="rarity">Rarity</option>
        <option value="oldest">Oldest</option>
      </select>
    </div>
    <!-- Fill to 10 controls with UX helpers (these don't affect filtering logic but keep the 10-bar layout consistent) -->
    <div>
      <label>&nbsp;</label>
      <button id="clear-filters" class="button clear-btn" type="button">Clear</button>
    </div>
    <div>
    <label>&nbsp;</label>
      <a id="share-link" class="button share-btn" href="#">Share</a>
    </div>
    <div>
      <label>&nbsp;</label>
      <div style="height:40px"></div>
    </div>
    <div>
      <label>&nbsp;</label>
      <div style="height:40px"></div>
    </div>
  </div>
</section>

<!-- View toggle -->
<div class="view-toggle">
  <button id="btn-gallery" class="toggle-btn active" type="button" title="Card Gallery">
    🖼️ <span>Card Gallery</span>
  </button>
  <button id="btn-table" class="toggle-btn" type="button" title="Data Form">
    📇 <span>Data Form</span>
  </button>
  <button id="btn-keywords" class="toggle-btn" type="button" title="Keywords">
    🔑 <span>Keywords</span>
  </button>
  <button id="btn-macros" class="toggle-btn" type="button" title="Macros">
    🌍 <span>Macros</span>
  </button>
</div>

<!-- Results -->
<section class="results">
  <div id="empty" class="empty" style="display:none;">No cards found</div>

  <div id="gallery" class="grid" aria-live="polite"></div>

  <div id="table-view" class="table-wrap" style="display:none;">
    <table>
      <thead>
      <tr>
        <th>Id</th>
        <th>Name</th>
        <th>Type</th>
        <th>Keywords</th>
        <th>House</th>
        <th>Rarity</th>
        <th>Release Version</th>
        <th>Release Year</th>
        <th><button id="export-btn" class="export-btn">Export Cards</button></th>
      </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <div id="keywords-view" class="table-wrap" style="display:none;">
    <table>
      <thead>
      <tr>
        <th>Id</th>
        <th>Name</th>
        <th class="description">Description</th>
        <th>Cards With</th>
        <th>Rarity</th>
        <th>Types</th>
        <th>Houses</th>
        <th>Release Version</th>
        <th>Release Year</th>
        <th><button id="keywords-export-btn" class="export-btn">Export Keywords</button></th>
      </tr>
      </thead>
      <tbody id="keywords-body"></tbody>
    </table>
  </div>

  <div id="macros-view" class="table-wrap" style="display:none;">
    <table>
      <thead>
      <tr>
        <th>Name</th>
        <th>Total</th>
        <th>(%)</th>
        <th>Commons</th>
        <th>(%)</th>
        <th>Rares</th>
        <th>(%)</th>
        <th>Super-rares</th>
        <th>(%)</th>
        <th>Short-printed</th>
        <th>(%)</th>
        <th><button id="macros-export-btn" class="export-btn">Export Macros</button></th>
      </tr>
      </thead>
      <tbody id="macros-body"></tbody>
    </table>
  </div>
</section>

<div id="toast" class="toast">Failed to load cards. Please try refreshing.</div>

<div class="buttons">
  <a href="https://store.steampowered.com/app/3435450/Hardest/" target="_blank" rel="noopener" class="button mark-down">
    Hardest on Steam
  </a>
</div>

<script>
  (() => {
    const API_URL = '../../api/hardest/';
    const CARDS_URL = API_URL + 'cards';
    const KEYWORDS_URL = API_URL + 'keywords';
    const qs = new URLSearchParams(location.search);

    // Elements
    const el = {
      name: document.getElementById('f-name'),
      keywords: document.getElementById('f-keywords'),
      type: document.getElementById('f-type'),
      house: document.getElementById('f-house'),
      rarity: document.getElementById('f-rarity'),
      releaseVersion: document.getElementById('f-releaseVersion'),
      releaseYear: document.getElementById('f-releaseYear'),
      orderBy: document.getElementById('f-orderBy'),
      clear: document.getElementById('clear-filters'),
      share: document.getElementById('share-link'),
      galleryBtn: document.getElementById('btn-gallery'),
      tableBtn: document.getElementById('btn-table'),
      keywordsBtn: document.getElementById('btn-keywords'),
      macrosBtn: document.getElementById('btn-macros'),
      gallery: document.getElementById('gallery'),
      tableWrap: document.getElementById('table-view'),
      tableBody: document.getElementById('table-body'),
      keywordsWrap: document.getElementById('keywords-view'),
      keywordsBody: document.getElementById('keywords-body'),
      macrosWrap: document.getElementById('macros-view'),
      macrosBody: document.getElementById('macros-body'),
      toast: document.getElementById('toast'),
      empty: document.getElementById('empty'),
    };

    // State
    let allCards = [];
    let allKeywords = [];
    let macros = [];
    const DEFAULT_VIEW = 'gallery';
    const DEFAULT_ORDER_BY = 'newest';
    let view = qs.get('view') || DEFAULT_VIEW;

    // Helpers
    const showToast = (msg) => {
      el.toast.textContent = msg || el.toast.textContent;
      el.toast.style.display = 'block';
      setTimeout(() => { el.toast.style.display = 'none'; }, 4000);
    };

    const setQueryParam = (key, value) => {
      const url = new URL(location.href);
      if (value === undefined || value === null || value === '') {
        url.searchParams.delete(key);
      } else {
        url.searchParams.set(key, value);
      }
      history.replaceState({}, '', url);
      el.share.href = url.toString();
    };

    const applyURLToControls = () => {
      el.name.value = qs.get('name') || '';
      el.keywords.value = qs.get('keywords') || '';
      el.type.value = qs.get('type') || '';
      el.house.value = qs.get('house') || '';
      el.rarity.value = qs.get('rarity') || '';
      el.releaseVersion.value = qs.get('releaseVersion') || '';
      el.releaseYear.value = qs.get('releaseYear') || '';
      el.orderBy.value = qs.get('orderBy') || DEFAULT_ORDER_BY;
    };

    const controlsToURL = () => {
      setQueryParam('name', el.name.value.trim());
      setQueryParam('keywords', el.keywords.value.trim());
      setQueryParam('type', el.type.value);
      setQueryParam('house', el.house.value);
      setQueryParam('rarity', el.rarity.value);
      setQueryParam('releaseVersion', el.releaseVersion.value);
      setQueryParam('releaseYear', el.releaseYear.value);
      setQueryParam('orderBy', el.orderBy.value === DEFAULT_ORDER_BY ? '' : el.orderBy.value);
      setQueryParam('view', view === DEFAULT_VIEW ? '' : view);
    };

    const hasNonDefaultFilters = () => {
      return Boolean(
        el.name.value.trim() ||
        el.keywords.value.trim() ||
        el.type.value ||
        el.house.value ||
        el.rarity.value ||
        el.releaseVersion.value ||
        el.releaseYear.value ||
        el.orderBy.value !== DEFAULT_ORDER_BY
      );
    };

    const updateClearButtonState = () => {
      el.clear.disabled = !hasNonDefaultFilters();
    };

    const normalize = (s) => (s || '').toString().toLowerCase();

    const matchKeywords = (cardKeywords, input) => {
      if (!input) return true;
      const tokens = input.split(',').join(' ').split(/\s+/).map(t => t.trim()).filter(Boolean);
      const hay = normalize(Array.isArray(cardKeywords) ? cardKeywords.join(' ') : String(cardKeywords));
      return tokens.every(t => hay.includes(normalize(t)));
    };

    const getTypeOrder = (type) => {
      switch (type) {
        case 'Rock':
          return 1;
        case 'Paper':
          return 2;
        case 'Scissor':
          return 3;
        case 'Bedrock':
          return 4;
        case 'Zipper':
          return 5;
        case 'Rockstar':
          return 6;
        case 'Mimic':
          return 7;
        case 'Gun':
          return 8;
        case 'God':
          return 9;
      }
      return 0;
    }

    const getHouseOrder = (house) => {
      switch (house) {
        case 'Champion':
          return 1;
        case 'Delusional':
          return 2;
        case 'Demonic':
          return 3;
        case 'Divine':
          return 4;
        case 'Hightech':
          return 5;
        case 'Kawaii':
          return 6;
        case 'Scam':
          return 7;
        case 'God':
          return 8;
      }
      return 0;
    }

    const getRarityOrder = (type) => {
      switch (type) {
        case 'Super-rare':
          return 1;
        case 'Rare':
          return 2;
        case 'Short-printed':
          return 3;
        case 'Common':
          return 4;
      }
      return 0;
    }

    const toPercentage = (float) => {
      const value = float * 100;
      return `${Number.isInteger(value) ? value : value.toFixed(2)}%`;
    };

    const calculateMacros = () => {
      const macroTemplate = {
        'name': '',
        'commons': 0,
        'commonsPercentage': 0,
        'rares': 0,
        'raresPercentage': 0,
        'superRares': 0,
        'superRaresPercentage': 0,
        'shortPrinted': 0,
        'shortPrintedPercentage': 0,
        'total': 0,
        'totalPercentage': 0
      }
      const commons = allCards.filter(c => c.rarity === 'Common');
      const rares = allCards.filter(c => c.rarity === 'Rare');
      const superRares = allCards.filter(c => c.rarity === 'Super-rare');
      const shortPrinted = allCards.filter(c => c.rarity === 'Short-printed');

      const buildAMacro = (name, filter) => {
        const filteredCommons = commons.filter(c => filter(c));
        const filteredRares = rares.filter(c => filter(c));
        const filteredSuperRares = superRares.filter(c => filter(c));
        const filteredShortPrinted = shortPrinted.filter(c => filter(c));
        const combinedLength = filteredCommons.length + filteredRares.length + filteredSuperRares.length + filteredShortPrinted.length
        return {
          'name': name,
          'commons': filteredCommons.length,
          'commonsPercentage': toPercentage(filteredCommons.length / commons.length),
          'rares': filteredRares.length,
          'raresPercentage': toPercentage(filteredRares.length / rares.length),
          'superRares': filteredSuperRares.length,
          'superRaresPercentage': toPercentage(filteredSuperRares.length / superRares.length),
          'shortPrinted': filteredShortPrinted.length,
          'shortPrintedPercentage': toPercentage(filteredShortPrinted.length / shortPrinted.length),
          'total': combinedLength,
          'totalPercentage': toPercentage(combinedLength / allCards.length)
        }
      }

      const rockFilter = (card) => { return card.type === 'Rock' };
      const paperFilter = (card) => { return card.type === 'Paper' };
      const scissorFilter = (card) => { return card.type === 'Scissor' };
      const gunFilter = (card) => { return card.type === 'Gun' };
      const mimicFilter = (card) => { return card.type === 'Mimic' };
      const godFilter = (card) => { return card.type === 'God' };
      const bedrockFilter = (card) => { return card.type === 'Bedrock' };
      const zipperFilter = (card) => { return card.type === 'Zipper' };
      const rockstarFilter = (card) => { return card.type === 'Rockstar' };
      const uniFilter = (card) => { return [ 'Rock', 'Paper', 'Scissor', 'Gun', 'Mimic', 'God' ].includes(card.type) };
      const multiFilter = (card) => { return [ 'Bedrock', 'Zipper', 'Rockstar' ].includes(card.type) };
      const championFilter = (card) => { return card.house === 'Champion' };
      const delusionalFilter = (card) => { return card.house === 'Delusional' };
      const demonicFilter = (card) => { return card.house === 'Demonic' };
      const divineFilter = (card) => { return card.house === 'Divine' };
      const hightechFilter = (card) => { return card.house === 'Hightech' };
      const kawaiiFilter = (card) => { return card.house === 'Kawaii' };
      const godHouseFilter = (card) => { return card.house === 'God' };
      const scamHouseFilter = (card) => { return card.house === 'Scam' };
      const noKeywordFilter = (card) => { return card.keywords.length === 0 };
      const oneKeywordFilter = (card) => { return card.keywords.length === 1 };
      const twoKeywordFilter = (card) => { return card.keywords.length === 2 };
      const threeKeywordFilter = (card) => { return card.keywords.length === 3 };
      const allFilter = () => { return true };

      const rocks = buildAMacro('Rock', rockFilter);
      const papers = buildAMacro('Paper ', paperFilter);
      const scissors = buildAMacro('Scissor', scissorFilter);
      const guns = buildAMacro('Gun', gunFilter);
      const mimics = buildAMacro('Mimic', mimicFilter);
      const gods = buildAMacro('God', godFilter);
      const bedrocks = buildAMacro('Bedrock', bedrockFilter);
      const zippers = buildAMacro('Zipper', zipperFilter);
      const rockstars = buildAMacro('Rockstar', rockstarFilter);
      const unis = buildAMacro('Uni', uniFilter);
      const multis = buildAMacro('Multi', multiFilter);
      const champions = buildAMacro('Champion', championFilter);
      const delusionals = buildAMacro('Delusional', delusionalFilter);
      const demonics = buildAMacro('Demonic', demonicFilter);
      const divines = buildAMacro('Divine', divineFilter);
      const hightechs = buildAMacro('Hightech', hightechFilter);
      const kawaiis = buildAMacro('Kawaii', kawaiiFilter);
      const godHouse = buildAMacro('God', godHouseFilter);
      const scamHouse = buildAMacro('Scam', scamHouseFilter);
      const noKeyword = buildAMacro('Vanilla', noKeywordFilter);
      const oneKeyword = buildAMacro('1 keyword', oneKeywordFilter);
      const twoKeyword = buildAMacro('2 keywords', twoKeywordFilter);
      const threeKeyword = buildAMacro('3 keywords', threeKeywordFilter);
      const all = buildAMacro('All', allFilter);

      macros = [
        rocks,
        papers,
        scissors,
        guns,
        mimics,
        gods,
        bedrocks,
        zippers,
        rockstars,
        macroTemplate,

        unis,
        multis,
        macroTemplate,

        champions,
        delusionals,
        demonics,
        divines,
        hightechs,
        kawaiis,
        godHouse,
        scamHouse,
        macroTemplate,

        noKeyword,
        oneKeyword,
        twoKeyword,
        threeKeyword,
        macroTemplate,

        all
      ];
    }

    const filterCards = () => {
      const name = normalize(el.name.value);
      const kw = normalize(el.keywords.value);
      const type = normalize(el.type.value);
      const house = normalize(el.house.value);
      const rarity = normalize(el.rarity.value);
      const releaseVersion = normalize(el.releaseVersion.value);
      const releaseYear = el.releaseYear.value; // keep as string
      const orderBy = normalize(el.orderBy.value);

      let out;
      let filteredKeywords;
      if (view === 'keywords') {
        out = allCards;
        filteredKeywords = allKeywords.filter(k => {
          const nameOk = !name || normalize(k.name).includes(name);
          const descOk = !kw || normalize(k.description).includes(kw);
          const typeOk = !type || matchKeywords(k.types, type);
          const houseOk = !house || matchKeywords(k.houses, house);
          const rarityOk = !rarity || normalize(k.rarity) === rarity;
          const versionOk = !releaseVersion || normalize(k.releaseVersion) === releaseVersion;
          const yearOk = !releaseYear || String(k.releaseYear) === releaseYear;
          return nameOk && descOk && typeOk && houseOk && rarityOk && versionOk && yearOk;
        });
      } else {
        out = allCards.filter(c => {
          const nameOk = !name || normalize(c.name).includes(name);
          const kwOk = matchKeywords(c.keywords, kw);
          const typeOk = !type || (type === 'multi' ? ['bedrock', 'zipper', 'rockstar'].includes(normalize(c.type)) : normalize(c.type) === type);
          const houseOk = !house || normalize(c.house) === house;
          const rarityOk = !rarity || normalize(c.rarity) === rarity;
          const versionOk = !releaseVersion || normalize(c.releaseVersion) === releaseVersion;
          const yearOk = !releaseYear || String(c.releaseYear) === releaseYear;
          return nameOk && kwOk && typeOk && houseOk && rarityOk && versionOk && yearOk;
        });
        filteredKeywords = allKeywords;
      }


      let orderedCards = out.sort((a, b) => b.id - a.id);

      switch (el.orderBy.value) {
        case 'name':
          orderedCards = orderedCards.sort((a, b) => a.name.localeCompare(b.name));
          break;
        case 'type':
          orderedCards = orderedCards.sort((a, b) => getTypeOrder(a.type) - getTypeOrder(b.type));
          break;
        case 'house':
          orderedCards = orderedCards.sort((a, b) => getHouseOrder(a.house) - getHouseOrder(b.house));
          break;
        case 'rarity':
          orderedCards = orderedCards.sort((a, b) => getRarityOrder(a.rarity) - getRarityOrder(b.rarity));
          break;
        case 'oldest':
          orderedCards = orderedCards.sort((a, b) => a.id - b.id);
          break;
      }

      let orderedKeywords = filteredKeywords.sort((a, b) => b.id - a.id);
      switch (el.orderBy.value) {
        case 'name':
          orderedKeywords = orderedKeywords.sort((a, b) => a.name.localeCompare(b.name));
          break;
        case 'rarity':
          orderedKeywords = orderedKeywords.sort((a, b) => a.cardsWith - b.cardsWith);
          break;
        case 'oldest':
          orderedKeywords = orderedKeywords.sort((a, b) => a.id - b.id);
          break;
      }

      let orderedMacros = macros;

      render(orderedCards, orderedKeywords, orderedMacros);
      updateClearButtonState();
    };

    const ensureViewButtons = () => {
      el.galleryBtn.classList.toggle('active', view === 'gallery');
      el.tableBtn.classList.toggle('active', view === 'table');
      el.keywordsBtn.classList.toggle('active', view === 'keywords');
      el.macrosBtn.classList.toggle('active', view === 'macros');
      el.gallery.style.display = (view === 'gallery') ? 'grid' : 'none';
      el.tableWrap.style.display = (view === 'table') ? 'block' : 'none';
      el.keywordsWrap.style.display = (view === 'keywords') ? 'block' : 'none';
      el.macrosWrap.style.display = (view === 'macros') ? 'block' : 'none';
    };

    const escapeHtml = (s) =>
            String(s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");

    const render = (cards, keywords, macros) => {
      // empty state
      if (!cards.length) {
        el.empty.style.display = 'block';
        el.gallery.innerHTML = '';
        el.tableBody.innerHTML = '';
        return;
      } else {
        el.empty.style.display = 'none';
      }
      if (view === 'gallery') {
        el.gallery.innerHTML = cards.slice(0, 35).map(c => {
          const kws = Array.isArray(c.keywords)
                  ? c.keywords.filter(k => k != null && k !== '')
                  : (c.keywords ? [c.keywords] : []);

          const keywordsHtml = kws
                  .map((kw, i) => {
                    const safeKw = escapeHtml(kw);
                    const description = allKeywords.find(kw => kw.name === safeKw).description;
                    const safeDescription = escapeHtml(description);
                    return `<span title="${safeKw} – ${safeDescription}">${safeKw}</span>`;
                  })
                  .join(', ');

          return `
      <article class="card" aria-label="Card ${escapeHtml(c.name)}">
        <img alt="${escapeHtml(c.name)}" src="../card-images/${c.id}.png" onerror="this.src=''; this.style.height='0';" />
        <div class="meta">
          <div><strong>#${c.id}</strong> — ${escapeHtml(c.name)}</div>
          <div class="kv">keywords: ${keywordsHtml}</div>
          <div class="kv">house: ${escapeHtml(c.house)} • rarity: ${escapeHtml(c.rarity)}</div>
          <div class="kv">releaseVersion: ${c.releaseVersion ?? '-'} • releaseYear: ${c.releaseYear ?? '-'}</div>
        </div>
      </article>
    `;
        }).join('');
      } else if (view === 'table') {
        el.tableBody.innerHTML = cards.map(c => `
            <tr>
              <td>${c.id}</td>
              <td>${c.name}</td>
              <td>${c.type}</td>
              <td>${Array.isArray(c.keywords) ? c.keywords.join(', ') : c.keywords}</td>
              <td>${c.house}</td>
              <td>${c.rarity}</td>
              <td>${c.releaseVersion ?? '-'}</td>
              <td>${c.releaseYear ?? '-'}</td>
            </tr>
          `).join('');
      } else if (view === 'keywords') {
        el.keywordsBody.innerHTML = keywords.map(k => `
          <tr>
            <td>${k.id}</td>
            <td>${k.name}</td>
            <td>${k.description}</td>
            <td>${k.cardsWith}</td>
            <td>${k.rarity}</td>
            <td>${k.types}</td>
            <td>${k.houses}</td>
            <td>${k.releaseVersion}</td>
            <td>${k.releaseYear}</td>
          </tr>
        `).join('');
      } else if (view === 'macros') {
        el.macrosBody.innerHTML = macros.map(m => {
          if (!m.name) {
            // render horizontal line across all columns
            return `
          <tr>
            <td colspan="11"><hr></td>
          </tr>
        `;
            }

            return `
          <tr>
            <td>${m.name}</td>
            <td>${m.total}</td>
            <td>${m.totalPercentage}</td>
            <td>${m.commons}</td>
            <td>${m.commonsPercentage}</td>
            <td>${m.rares}</td>
            <td>${m.raresPercentage}</td>
            <td>${m.superRares}</td>
            <td>${m.superRaresPercentage}</td>
            <td>${m.shortPrinted}</td>
            <td>${m.shortPrintedPercentage}</td>
          </tr>
        `;
        }).join('');
      }
    };

    // Event wiring
    ['input', 'change'].forEach(evt => {
      [el.name, el.keywords, el.type, el.house, el.rarity, el.releaseVersion, el.releaseYear, el.orderBy].forEach(ctrl => {
        ctrl.addEventListener(evt, () => { controlsToURL(); filterCards(); });
      });
    });

    el.clear.addEventListener('click', () => {
      el.name.value = '';
      el.keywords.value = '';
      el.type.value = '';
      el.house.value = '';
      el.rarity.value = '';
      el.releaseVersion.value = '';
      el.releaseYear.value = '';
      el.orderBy.value = DEFAULT_ORDER_BY;
      controlsToURL();
      filterCards();
    });

    el.galleryBtn.addEventListener('click', () => {
      view = 'gallery';
      ensureViewButtons();
      controlsToURL();
      filterCards();
    });
    el.tableBtn.addEventListener('click', () => {
      view = 'table';
      ensureViewButtons();
      controlsToURL();
      filterCards();
    });
    el.keywordsBtn.addEventListener('click', () => {
      view = 'keywords';
      ensureViewButtons();
      controlsToURL();
      filterCards();
    });
    el.macrosBtn.addEventListener('click', () => {
      view = 'macros';
      ensureViewButtons();
      controlsToURL();
      filterCards();
    });

    // Initial load
    (async function init() {
      applyURLToControls();
      updateClearButtonState();
      ensureViewButtons();
      try {
        const res = await fetch(CARDS_URL, { method: 'GET' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        allCards = Array.isArray(data) ? data : (data.cards || []);
        allCards = allCards.map(card => ({
          ...card,
          name: card.name.replace(/\[.*?\]/g, ""),
          releaseYear: card.releaseDate ? card.releaseDate.split("-")[0] : null
        }));
        calculateMacros();
      } catch (err) {
        showToast('Failed to load cards. Please try refreshing.');
        allCards = [];
      }
      try {
        const res = await fetch(KEYWORDS_URL, { method: 'GET' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        allKeywords = Array.isArray(data) ? data : (data.keywords || []);
        allKeywords = allKeywords.map(keyword => {
          const cardsWith = allCards.filter(card => card.keywords.includes(keyword.name));
          const cardCount = cardsWith.length;
          const types = cardsWith.reduce((acc, card) => {
            if (!acc.includes(card.type)) acc.push(card.type);
            return acc;
          }, []);
          const houses = cardsWith.reduce((acc, card) => {
            if (!acc.includes(card.house)) acc.push(card.house);
            return acc;
          }, []);
          let rarity = 'Short-printed';
          if (cardCount > 5) {
            rarity = 'Common';
          } else if (cardCount > 1) {
            rarity = 'Rare';
          } else if (cardCount > 0) {
            rarity = 'Super-rare';
          }
          return {
            ...keyword,
            description: keyword.description.replace(/\[.*?\]/g, ""),
            cardsWith: cardCount,
            rarity: rarity,
            types: types.sort((a, b) => getTypeOrder(a) - getTypeOrder(b)).join(', '),
            houses: houses.sort((a, b) => getHouseOrder(a) - getHouseOrder(b)).join(', '),
            releaseYear: keyword.releaseDate ? keyword.releaseDate.split("-")[0] : null
          };
        });
      } catch (err) {
        showToast('Failed to load keywords. Please try refreshing.');
        allKeywords = [];
      }
      controlsToURL();
      filterCards();
    })();
  })();

  document.getElementById('share-link').addEventListener('click', function (e) {
    e.preventDefault(); // stop it from navigating

    const url = window.location.href; // get current page URL
    const toast = document.getElementById('toast');
    const showCopyToast = (message) => {
      if (!toast) return;
      toast.textContent = message;
      toast.classList.remove('copy-toast-active');
      toast.style.display = 'block';

      // Restart animation if user clicks Share repeatedly.
      void toast.offsetWidth;
      toast.classList.add('copy-toast-active');

      if (toast._hideTimer) clearTimeout(toast._hideTimer);
      toast._hideTimer = setTimeout(() => {
        toast.classList.remove('copy-toast-active');
        toast.style.display = 'none';
      }, 1900);
    };
    navigator.clipboard.writeText(url)
            .then(() => {
              showCopyToast('Share link copied to clipboard.');
            })
            .catch(err => {
              showCopyToast('Failed to copy share link.');
              console.error('Failed to copy URL:', err);
            });
  });

  const addTableExport = (id, fileName) => {
    const btn = document.getElementById(id);
    if (!btn) return;
    btn.addEventListener("click", function (e) {
      e.preventDefault();
      const table = btn.closest("table");
      if (!table) {
        console.error("Export button is not inside a table.");
        return;
      }

      const rows = Array.from(table.rows);
      const csvLines = rows.map((row, i) => {
        const cells = i === 0 ? Array.from(row.cells).slice(0, -1) : Array.from(row.cells);
        const parts = cells.map((cell) => {
          const text = cell.innerText.replace(/"/g, '""');
          return `"${text}"`;
        });
        return parts.join(",");
      });

      const blob = new Blob([csvLines.join("\n")], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(url);
    });
  }
  addTableExport('export-btn', 'cards.csv');
  addTableExport('keywords-export-btn', 'keywords.csv');
  addTableExport('macros-export-btn', 'macros.csv');
</script>
