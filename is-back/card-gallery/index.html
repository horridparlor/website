<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rakuel Is Back – Card Gallery</title>
  <link rel="stylesheet" href="../../styles.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <a class="home-link" href="/">Home</a>
    <h1>Rakuel Is Back – Card Gallery</h1>
  </div>
  <div class="topbar-right">
    <a href="../deck-builder/" class="btn btn-nav">Deck Builder →</a>
    <a href="../gameplay/" class="btn btn-nav">Gameplay →</a>
    <button id="filter-toggle-btn" class="filter-toggle-btn" type="button" aria-expanded="false" aria-controls="filters-section">
      ☰ Filters <span id="filter-badge" class="filter-badge"></span>
    </button>
  </div>
</header>

<!-- Filters -->
<section class="filters" id="filters-section">
  <div class="filters-wrap" id="filters">
    <div>
      <label for="f-name">Name</label>
      <input id="f-name" type="text" placeholder="Search name" />
    </div>
    <div>
      <label for="f-keywords">Keywords</label>
      <input id="f-keywords" type="text" placeholder="e.g. greed, wizard" />
    </div>
    <div>
      <label for="f-type">Type</label>
      <select id="f-type">
        <option value="">Any</option>
        <option>Rock</option>
        <option>Paper</option>
        <option>Scissors</option>
      </select>
    </div>
    <div>
      <label for="f-power">Power</label>
      <select id="f-power">
        <option value="">Any</option>
        <option value="0">0 000</option>
        <option value="1000">1 000</option>
        <option value="2000">2 000</option>
        <option value="3000">3 000</option>
        <option value="4000">4 000</option>
        <option value="5000">5 000</option>
        <option value="6000">6 000</option>
        <option value="7000">7 000</option>
        <option value="8000">8 000</option>
        <option value="9000">9 000</option>
        <option value="10000">10 000</option>
        <option value="11000">11 000</option>
        <option value="12000">12 000</option>
        <option value="13000">13 000</option>
      </select>
    </div>
    <div id="power-is-wrap" style="display:none;">
      <label for="f-powerIs">Power Is</label>
      <select id="f-powerIs">
        <option value="eq">Equals</option>
        <option value="gte">More Or Equal</option>
        <option value="lte">Less Or Equal</option>
        <option value="gt">More Than</option>
        <option value="lt">Less Than</option>
      </select>
    </div>
    <div>
      <label for="f-kwCount">Keyword Count</label>
      <select id="f-kwCount">
        <option value="">Any</option>
        <option value="0">Vanilla</option>
        <option value="1">1 Keyword</option>
        <option value="2">2 Keywords</option>
        <option value="3">3 Keywords</option>
      </select>
    </div>
    <div>
      <label for="f-keyword">Keyword</label>
      <select id="f-keyword">
        <option value="">Any</option>
      </select>
    </div>
    <div>
      <label for="f-expansion">Expansion</label>
      <select id="f-expansion">
        <option value="">Any</option>
      </select>
    </div>
    <div>
      <label for="f-releaseYear">Release Year</label>
      <select id="f-releaseYear">
        <option value="">Any</option>
        <option>2026</option>
        <option>2027</option>
      </select>
    </div>
    <div id="decklist-filter-wrap" style="display:none;">
      <label for="f-decklist">In Decklist</label>
      <select id="f-decklist">
        <option value="">Any</option>
      </select>
    </div>
    <div>
      <label for="f-orderBy">Order By</label>
      <select id="f-orderBy">
        <option value="oldest">Oldest</option>
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
        <option value="name">Name</option>
        <option value="type">Type</option>
        <option value="power">Power</option>
      </select>
    </div>
    <div>
      <label for="f-direction">Direction</label>
      <select id="f-direction">
        <option value="asc">Ascending</option>
        <option value="desc">Descending</option>
      </select>
    </div>
    <div>
      <label id="filter-count" class="filter-count"></label>
      <button id="clear-filters" class="button clear-btn" type="button">Clear</button>
    </div>
  </div>
</section>

<!-- View toggle -->
<div class="view-toggle">
  <button id="btn-cards" class="toggle-btn active" type="button" title="Cards">
    🖼️ <span>Card Gallery</span>
  </button>
  <button id="btn-gallery" class="toggle-btn" type="button" title="Card Gallery">
    🃏 <span>Card Art</span>
  </button>
  <button id="btn-table" class="toggle-btn" type="button" title="Data Form">
    📇 <span>Data Form</span>
  </button>
  <button id="btn-keywords" class="toggle-btn" type="button" title="Keywords">
    🔑 <span>Keywords</span>
  </button>
  <button id="btn-macros" class="toggle-btn" type="button" title="Macros">
    🌍 <span>Macros</span>
  </button>
  <button id="btn-rules" class="toggle-btn" type="button" title="Rules">
    📖 <span>Rules</span>
  </button>
</div>

<!-- Bulk download bar (visible when cards checked in gallery view) -->
<div id="bulk-bar" class="bulk-bar" style="display:none;">
  <span id="checked-count"></span>
  <button id="bulk-download-btn" type="button" class="button bulk-dl-btn">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="1" x2="7" y2="9.5"/><polyline points="4,7 7,10 10,7"/><line x1="2" y1="13" x2="12" y2="13"/></svg>
    Download Selected
  </button>
  <button id="select-all-btn" type="button" class="button select-all-btn">Select All</button>
  <button id="clear-checks-btn" type="button" class="button clear-btn">Clear Selection</button>
</div>

<!-- Results -->
<section class="results">
  <div id="empty" class="empty" style="display:none;">No cards found</div>

  <div id="gallery" class="grid" aria-live="polite"></div>

  <div id="cards-view" class="cards-grid" style="display:none;" aria-live="polite"></div>

  <div id="table-view" class="table-wrap" style="display:none;">
    <table>
      <thead>
      <tr>
        <th>Id</th>
        <th>Name</th>
        <th>Type</th>
        <th>Power</th>
        <th>Keywords</th>
        <th>Release Year</th>
        <th><button id="export-btn" class="export-btn">Export Cards</button></th>
      </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <div id="keywords-view" class="table-wrap" style="display:none;">
    <table>
      <thead>
      <tr>
        <th>Id</th>
        <th>Name</th>
        <th class="description">Description</th>
        <th>Cards With</th>
        <th>Types</th>
        <th><button id="keywords-export-btn" class="export-btn">Export Keywords</button></th>
      </tr>
      </thead>
      <tbody id="keywords-body"></tbody>
    </table>
  </div>

  <div id="macros-view" class="table-wrap" style="display:none;">
    <table>
      <thead>
      <tr>
        <th>Name</th>
        <th>Total</th>
        <th>(%)</th>
        <th>Rock</th>
        <th>(%)</th>
        <th>Paper</th>
        <th>(%)</th>
        <th>Scissors</th>
        <th>(%)</th>
        <th><button id="macros-export-btn" class="export-btn">Export Macros</button></th>
      </tr>
      </thead>
      <tbody id="macros-body"></tbody>
    </table>
  </div>

  <div id="rules-view" style="display:none;"></div>
</section>

<div id="toast" class="toast">Failed to load cards. Please try refreshing.</div>

<script src="rules.js"></script>
<script>
  (() => {
    const API_URL        = '../../api/is-back/';
    const CARDS_URL      = API_URL + 'cards';
    const KEYWORDS_URL   = API_URL + 'keywords';
    const EXPANSIONS_URL = API_URL + 'expansions';
    const DECKS_URL      = API_URL + 'decks';
    const qs = new URLSearchParams(location.search);

    const el = {
      name:           document.getElementById('f-name'),
      keywords:       document.getElementById('f-keywords'),
      type:           document.getElementById('f-type'),
      power:          document.getElementById('f-power'),
      kwCount:        document.getElementById('f-kwCount'),
      powerIs:        document.getElementById('f-powerIs'),
      keyword:        document.getElementById('f-keyword'),
      expansion:      document.getElementById('f-expansion'),
      releaseYear:    document.getElementById('f-releaseYear'),
      decklist:       document.getElementById('f-decklist'),
      decklistWrap:   document.getElementById('decklist-filter-wrap'),
      orderBy:        document.getElementById('f-orderBy'),
      direction:      document.getElementById('f-direction'),
      clear:          document.getElementById('clear-filters'),
      galleryBtn:     document.getElementById('btn-gallery'),
      cardsBtn:       document.getElementById('btn-cards'),
      tableBtn:       document.getElementById('btn-table'),
      keywordsBtn:    document.getElementById('btn-keywords'),
      macrosBtn:      document.getElementById('btn-macros'),
      rulesBtn:       document.getElementById('btn-rules'),
      gallery:        document.getElementById('gallery'),
      cardsWrap:      document.getElementById('cards-view'),
      tableWrap:      document.getElementById('table-view'),
      tableBody:      document.getElementById('table-body'),
      keywordsWrap:   document.getElementById('keywords-view'),
      keywordsBody:   document.getElementById('keywords-body'),
      macrosWrap:     document.getElementById('macros-view'),
      macrosBody:     document.getElementById('macros-body'),
      rulesWrap:      document.getElementById('rules-view'),
      bulkBar:        document.getElementById('bulk-bar'),
      checkedCount:   document.getElementById('checked-count'),
      bulkDownload:   document.getElementById('bulk-download-btn'),
      selectAll:      document.getElementById('select-all-btn'),
      clearChecks:    document.getElementById('clear-checks-btn'),
      toast:          document.getElementById('toast'),
      empty:          document.getElementById('empty'),
      filterCount:    document.getElementById('filter-count'),
      filtersSection: document.getElementById('filters-section'),
      filterToggleBtn: document.getElementById('filter-toggle-btn'),
      filterBadge:    document.getElementById('filter-badge'),
    };

    const CARDS_ORDER_OPTIONS = [
      { value: 'newest', label: 'Newest' },
      { value: 'oldest', label: 'Oldest' },
      { value: 'name',   label: 'Name'   },
      { value: 'type',   label: 'Type'   },
      { value: 'power',  label: 'Power'  },
    ];
    const KEYWORDS_ORDER_OPTIONS = [
      { value: 'newest',       label: 'Newest'       },
      { value: 'oldest',       label: 'Oldest'       },
      { value: 'name',         label: 'Name'         },
      { value: 'most-common',  label: 'Most Common'  },
      { value: 'least-common', label: 'Least Common' },
    ];

    let allCards    = [];
    let allKeywords = [];
    let macros      = [];
    let expansions  = []; // [{id, name, firstCardId, lastCardId, isReleased, showExpansionInCardGallery, showInDeckBuilder}]
    let view        = qs.get('view') || 'cards';
    const checkedIds  = new Set();
    let visibleCardIds = [];
    let decklistCardIds = null; // null = no filter; Set of card IDs when a deck is selected
    const galleryArtVersions = {}; // cardId → current art version (1-based)

    const countActiveFilters = () => {
      let n = 0;
      if (el.name.value.trim())             n++;
      if (el.keywords.value.trim())         n++;
      if (el.type.value)                    n++;
      if (el.power.value)                   n++;
      if (el.kwCount.value)                 n++;
      if (el.keyword.value)                 n++;
      if (el.expansion.value)               n++;
      if (el.releaseYear.value)             n++;
      if (el.decklist.value)                n++;
      if (el.orderBy.value !== 'oldest')    n++;
      if (el.direction.value !== 'asc')     n++;
      return n;
    };

    const updateFilterBadge = () => {
      const n = countActiveFilters();
      el.filterBadge.textContent = n;
      el.filterBadge.classList.toggle('visible', n > 0);
      el.clear.disabled = n === 0;
    };

    if (el.filterToggleBtn) {
      el.filterToggleBtn.addEventListener('click', () => {
        const isOpen = el.filtersSection.classList.toggle('filters-open');
        el.filterToggleBtn.classList.toggle('active', isOpen);
        el.filterToggleBtn.setAttribute('aria-expanded', String(isOpen));
      });
    }

    const syncPowerIsVisibility = () => {
      document.getElementById('power-is-wrap').style.display = el.power.value !== '' ? '' : 'none';
    };

    // ── Expansion helpers ─────────────────────────────────────────────────
    // 'released' → show normally
    // 'hidden'   → show in filter list but exclude from default (unfiltered) view
    // 'null'     → completely invisible
    const getExpansionForCard = (cardId) =>
      expansions.find(e => cardId >= e.firstCardId && cardId <= e.lastCardId) || null;

    const getExpansionStatus = (expansion) => {
      if (!expansion) return expansions.length ? 'null' : 'released';
      if (expansion.isReleased) return 'released';
      if (expansion.showExpansionInCardGallery) return 'hidden';
      return 'null';
    };

    // ── Helpers ──────────────────────────────────────────────────────────

    const showToast = (msg) => {
      el.toast.textContent = msg || el.toast.textContent;
      el.toast.style.display = 'block';
      setTimeout(() => { el.toast.style.display = 'none'; }, 4000);
    };

    const setQueryParam = (key, value) => {
      const url = new URL(location.href);
      if (value === undefined || value === null || value === '') {
        url.searchParams.delete(key);
      } else {
        url.searchParams.set(key, value);
      }
      history.replaceState({}, '', url);
    };

    const applyURLToControls = () => {
      el.name.value        = qs.get('name')        || '';
      el.keywords.value    = qs.get('keywords')    || '';
      el.type.value        = qs.get('type')        || '';
      el.power.value       = qs.get('power')       || '';
      el.powerIs.value     = qs.get('powerIs')     || 'eq';
      el.kwCount.value     = qs.get('kwCount')     || '';
      el.keyword.value     = qs.get('keyword')     || '';
      el.expansion.value   = qs.get('expansion')   || '';
      el.releaseYear.value = qs.get('releaseYear') || '';
      el.orderBy.value     = qs.get('orderBy')     || 'oldest';
      el.direction.value   = qs.get('direction')   || 'asc';
      syncPowerIsVisibility();
    };

    const controlsToURL = () => {
      setQueryParam('name',        el.name.value.trim());
      setQueryParam('keywords',    el.keywords.value.trim());
      setQueryParam('type',        el.type.value);
      setQueryParam('power',       el.power.value);
      setQueryParam('powerIs',     el.power.value ? el.powerIs.value : '');
      setQueryParam('kwCount',     el.kwCount.value);
      setQueryParam('keyword',     el.keyword.value);
      setQueryParam('expansion',   el.expansion.value);
      setQueryParam('releaseYear', el.releaseYear.value);
      setQueryParam('decklist',    el.decklist.value);
      setQueryParam('orderBy',     el.orderBy.value);
      setQueryParam('direction',   el.direction.value);
      setQueryParam('view',        view);
    };

    const normalize  = (s) => (s || '').toString().toLowerCase();
    const capitalize = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

    const escapeHtml = (s) =>
      String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    const resolveTypeTokens = (desc, cardType) => {
      if (!desc || !cardType) return desc || '';
      const info = {
        rock:     { weak: 'paper',   same: 'rock',    strong: 'scissor'  },
        paper:    { weak: 'scissor', same: 'paper',   strong: 'rock'     },
        scissors: { weak: 'rock',    same: 'scissor', strong: 'paper'    },
      }[cardType.toLowerCase()];
      if (!info) return desc;
      const plural  = s => s === 'scissor' ? 'scissors' : s + 's';
      const article = s => s === 'scissor' ? 'scissors' : 'a ' + s;
      return desc
        .replace(/%WEAK_TYPES/g,   plural(info.weak))
        .replace(/%SAME_TYPES/g,   plural(info.same))
        .replace(/%STRONG_TYPES/g, plural(info.strong))
        .replace(/%WEAK_TYPE/g,    article(info.weak))
        .replace(/%SAME_TYPE/g,    article(info.same))
        .replace(/%STRONG_TYPE/g,  article(info.strong));
    };

    const matchKeywords = (cardKeywords, input) => {
      if (!input) return true;
      const tokens = input.split(',').join(' ').split(/\s+/).map(t => t.trim()).filter(Boolean);
      const hay = normalize(Array.isArray(cardKeywords) ? cardKeywords.join(' ') : String(cardKeywords));
      return tokens.every(t => hay.includes(normalize(t)));
    };

    const getTypeOrder = (type) => ({ Rock: 1, Paper: 2, Scissors: 3 }[type] || 0);

    const toPercentage = (float) => {
      const value = float * 100;
      return `${Number.isInteger(value) ? value : value.toFixed(2)}%`;
    };

    const formatPower = (p) => String(Number(p)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

    const mean   = (arr) => arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : null;
    const median = (arr) => {
      if (!arr.length) return null;
      const s = [...arr].sort((a, b) => a - b);
      const m = Math.floor(s.length / 2);
      return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
    };
    const toDiff = (val, ref) => {
      if (val === null || ref === null || ref === 0) return '--';
      const pct = ((val - ref) / ref) * 100;
      const sign = pct > 0 ? '+' : '';
      return `${sign}${Math.abs(pct) < 0.05 ? '0' : (Number.isInteger(pct) ? pct : pct.toFixed(1))}%`;
    };

    const calculateMacros = () => {
      const rocks    = allCards.filter(c => normalize(c.type) === 'rock');
      const papers   = allCards.filter(c => normalize(c.type) === 'paper');
      const scissors = allCards.filter(c => normalize(c.type) === 'scissors');

      const buildAMacro = (name, filter) => {
        const fAll      = allCards.filter(filter);
        const fRocks    = rocks.filter(filter);
        const fPapers   = papers.filter(filter);
        const fScissors = scissors.filter(filter);
        return {
          name,
          total:              fAll.length,
          totalPercentage:    allCards.length ? toPercentage(fAll.length / allCards.length) : '–',
          rock:               fRocks.length,
          rockPercentage:     rocks.length    ? toPercentage(fRocks.length    / rocks.length)    : '–',
          paper:              fPapers.length,
          paperPercentage:    papers.length   ? toPercentage(fPapers.length   / papers.length)   : '–',
          scissors:           fScissors.length,
          scissorsPercentage: scissors.length ? toPercentage(fScissors.length / scissors.length) : '–',
        };
      };

      const sep = {};
      const powerValues = [0, 1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000, 11000, 12000, 13000];

      // Average and median stat rows
      const totalAvg = mean(allCards.map(c => c.power));
      const totalMed = median(allCards.map(c => c.power));
      const rockAvg  = mean(rocks.map(c => c.power));
      const paperAvg = mean(papers.map(c => c.power));
      const scissAvg = mean(scissors.map(c => c.power));
      const rockMed  = median(rocks.map(c => c.power));
      const paperMed = median(papers.map(c => c.power));
      const scissMed = median(scissors.map(c => c.power));
      const fmt = (v) => v !== null ? formatPower(Math.round(v)) : '--';

      const avgRow = {
        name: 'Average Power',
        total:              fmt(totalAvg),
        totalPercentage:    toDiff(totalAvg, totalMed),  // avg vs median: skew indicator
        rock:               fmt(rockAvg),
        rockPercentage:     toDiff(rockAvg,  totalAvg),  // rock avg vs total avg
        paper:              fmt(paperAvg),
        paperPercentage:    toDiff(paperAvg, totalAvg),
        scissors:           fmt(scissAvg),
        scissorsPercentage: toDiff(scissAvg, totalAvg),
      };
      const medRow = {
        name: 'Median Power',
        total:              fmt(totalMed),
        totalPercentage:    toDiff(totalMed, totalAvg),  // median vs avg
        rock:               fmt(rockMed),
        rockPercentage:     toDiff(rockMed,  totalMed),  // rock median vs total median
        paper:              fmt(paperMed),
        paperPercentage:    toDiff(paperMed, totalMed),
        scissors:           fmt(scissMed),
        scissorsPercentage: toDiff(scissMed, totalMed),
      };

      macros = [
        buildAMacro('Rock',     c => normalize(c.type) === 'rock'),
        buildAMacro('Paper',    c => normalize(c.type) === 'paper'),
        buildAMacro('Scissors', c => normalize(c.type) === 'scissors'),
        sep,
        ...powerValues.map(p => buildAMacro(formatPower(p), c => c.power === p)),
        sep,
        avgRow,
        medRow,
        sep,
        buildAMacro('Vanilla',    c => c.keywords.length === 0),
        buildAMacro('1 Keyword',  c => c.keywords.length === 1),
        buildAMacro('2 Keywords', c => c.keywords.length === 2),
        buildAMacro('3 Keywords', c => c.keywords.length === 3),
        sep,
        buildAMacro('All', () => true),
      ];
    };

    const removeBbcodeTags = (s) => s.replace(/\[[^\]]*\]/g, '');
    const cardImgName    = (c) => { const cleaned = removeBbcodeTags(c.name); const n = cleaned.startsWith('The ') ? cleaned.slice(4) : cleaned; return `${c.id} - ${n}`; };
    const cardArtPathV   = (c, av) => { const suffix = (av && av > 1) ? ` (${av})` : ''; return `../card-art/${encodeURIComponent(cardImgName(c) + suffix)}.png`; };
    const cardFinalPathV = (c, av) => { const suffix = (av && av > 1) ? ` (${av})` : ''; return `../card-images/${encodeURIComponent(cardImgName(c) + suffix)}.png`; };
    const cardArtPath   = (c) => cardArtPathV(c, galleryArtVersions[c.id] || 1);
    const cardFinalPath = (c) => cardFinalPathV(c, galleryArtVersions[c.id] || 1);

    const DL_ICON = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="1" x2="7" y2="9.5"/><polyline points="4,7 7,10 10,7"/><line x1="2" y1="13" x2="12" y2="13"/></svg>`;

    const CARD_BACK = { id: 0, name: 'Card Back', type: '', power: 0, keywords: [], releaseYear: null };

    // ── Bulk bar ─────────────────────────────────────────────────────────

    const updateBulkBar = () => {
      const n = checkedIds.size;
      el.bulkBar.style.display = ((view === 'gallery' || view === 'cards') && n > 0) ? 'flex' : 'none';
      el.checkedCount.textContent = `${n} card${n !== 1 ? 's' : ''} selected`;
    };

    const triggerDownload = (url, filename) => {
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    };

    el.bulkDownload.addEventListener('click', () => {
      const cards = [CARD_BACK, ...allCards].filter(c => checkedIds.has(c.id));
      cards.forEach((c, i) => {
        setTimeout(() => triggerDownload(cardFinalPath(c), `${cardImgName(c)}.png`), i * 300);
      });
    });

    el.selectAll.addEventListener('click', () => {
      visibleCardIds.forEach(id => checkedIds.add(id));
      updateBulkBar();
      filterCards();
    });

    el.clearChecks.addEventListener('click', () => {
      checkedIds.clear();
      updateBulkBar();
      filterCards();
    });

    // ── Order By options ─────────────────────────────────────────────────

    const updateOrderByOptions = () => {
      const options = view === 'keywords' ? KEYWORDS_ORDER_OPTIONS : CARDS_ORDER_OPTIONS;
      const current = el.orderBy.value;
      el.orderBy.innerHTML = options.map(o =>
        `<option value="${o.value}">${o.label}</option>`
      ).join('');
      if (options.find(o => o.value === current)) el.orderBy.value = current;
    };

    // ── View buttons ──────────────────────────────────────────────────────

    const ensureViewButtons = () => {
      el.galleryBtn.classList.toggle('active',  view === 'gallery');
      el.cardsBtn.classList.toggle('active',    view === 'cards');
      el.tableBtn.classList.toggle('active',    view === 'table');
      el.keywordsBtn.classList.toggle('active', view === 'keywords');
      el.macrosBtn.classList.toggle('active',   view === 'macros');
      el.rulesBtn.classList.toggle('active',    view === 'rules');
      el.gallery.style.display      = (view === 'gallery')  ? 'grid'  : 'none';
      el.cardsWrap.style.display    = (view === 'cards')    ? 'grid'  : 'none';
      el.tableWrap.style.display    = (view === 'table')    ? 'block' : 'none';
      el.keywordsWrap.style.display = (view === 'keywords') ? 'block' : 'none';
      el.macrosWrap.style.display   = (view === 'macros')   ? 'block' : 'none';
      el.rulesWrap.style.display    = (view === 'rules')    ? 'block' : 'none';
      updateOrderByOptions();
      updateBulkBar();
    };

    // ── Filter & sort ─────────────────────────────────────────────────────

    const filterCards = () => {
      if (view === 'rules') { el.filterCount.textContent = ''; return; }
      const name        = normalize(el.name.value);
      const kw          = normalize(el.keywords.value);
      const type        = normalize(el.type.value);
      const power       = el.power.value   !== '' ? Number(el.power.value)   : null;
      const powerIs     = el.powerIs.value || 'eq';
      const kwCount     = el.kwCount.value !== '' ? Number(el.kwCount.value) : null;
      const kwSpecific  = el.keyword.value;
      const expansion   = el.expansion.value !== '' ? Number(el.expansion.value) : null;
      const releaseYear = el.releaseYear.value;
      const orderBy     = el.orderBy.value;
      const dir         = el.direction.value;

      let filteredKeywords;
      let out; // cards matching the current filter

      if (view === 'keywords') {
        out = allCards;
        filteredKeywords = allKeywords.filter(k => {
          const nameOk = !name || normalize(k.displayName).includes(name) || normalize(k.name).includes(name);
          const descOk = !kw   || normalize(k.description).includes(kw);
          const typeOk = !type || matchKeywords(k.types, type);
          return nameOk && descOk && typeOk;
        });
      } else {
        out = allCards.filter(c => {
          const nameOk  = !name        || normalize(c.name).includes(name);
          const kwOk    = !kw || (() => {
            const tokens = kw.split(',').join(' ').split(/\s+/).map(t => t.trim()).filter(Boolean);
            const kws = Array.isArray(c.keywords) ? c.keywords.filter(k => k != null && k !== '') : [];
            const hay = normalize([
              ...kws,
              ...kws.flatMap(name => {
                const d = allKeywords.find(k => k.name === name);
                return d ? [d.displayName, d.description] : [];
              }),
            ].join(' '));
            return tokens.every(t => hay.includes(t));
          })();
          const typeOk  = !type        || normalize(c.type) === type;
          const powerOk   = power === null || (
            powerIs === 'gt'  ? c.power >  power :
            powerIs === 'lt'  ? c.power <  power :
            powerIs === 'gte' ? c.power >= power :
            powerIs === 'lte' ? c.power <= power :
                                c.power === power
          );
          const effectiveKws = Array.isArray(c.keywords) ? c.keywords.filter(k => k != null && k !== '') : (c.keywords ? [c.keywords] : []);
          const kwCountOk   = kwCount === null || effectiveKws.length === kwCount;
          const kwSpecificOk = !kwSpecific || (kwSpecific === 'vanilla' ? effectiveKws.length === 0 : effectiveKws.includes(kwSpecific));
          const cardExp      = getExpansionForCard(c.id);
          const setStatus    = getExpansionStatus(cardExp);
          const expansionOk  = setStatus !== 'null' && (expansion === null ? setStatus === 'released' : (cardExp && cardExp.id === expansion));
          const yearOk       = !releaseYear || String(c.releaseYear) === releaseYear;
          const decklistOk   = !decklistCardIds || decklistCardIds.has(c.id);
          return nameOk && kwOk && typeOk && powerOk && kwCountOk && kwSpecificOk && expansionOk && yearOk && decklistOk;
        });
        filteredKeywords = allKeywords;
      }

      // Sort cards
      let orderedCards = [...out];
      switch (orderBy) {
        case 'newest': orderedCards.sort((a, b) => b.id - a.id); break;
        case 'oldest': orderedCards.sort((a, b) => a.id - b.id); break;
        case 'name':
          orderedCards.sort((a, b) => a.name.localeCompare(b.name));
          if (dir === 'desc') orderedCards.reverse();
          break;
        case 'type':
          orderedCards.sort((a, b) => getTypeOrder(capitalize(a.type)) - getTypeOrder(capitalize(b.type)));
          if (dir === 'desc') orderedCards.reverse();
          break;
        case 'power':
          orderedCards.sort((a, b) => dir === 'desc' ? b.power - a.power : a.power - b.power);
          break;
      }

      // Checked cards that don't match the filter — pin them at the top
      visibleCardIds = out.map(c => c.id);
      const filteredIds = new Set(visibleCardIds);
      const pinnedOnly  = allCards.filter(c => checkedIds.has(c.id) && !filteredIds.has(c.id));
      const allDisplay  = [...pinnedOnly, ...orderedCards];

      // Sort keywords
      let orderedKeywords = [...filteredKeywords];
      switch (orderBy) {
        case 'newest':       orderedKeywords.sort((a, b) => b.id - a.id); break;
        case 'oldest':       orderedKeywords.sort((a, b) => a.id - b.id); break;
        case 'most-common':  orderedKeywords.sort((a, b) => b.cardsWith - a.cardsWith); break;
        case 'least-common': orderedKeywords.sort((a, b) => a.cardsWith - b.cardsWith); break;
        case 'name':
          orderedKeywords.sort((a, b) => a.displayName.localeCompare(b.displayName));
          if (dir === 'desc') orderedKeywords.reverse();
          break;
      }

      const n = view === 'keywords' ? orderedKeywords.length : out.length;
      const word = view === 'keywords' ? 'keyword' : 'card';
      el.filterCount.textContent = `(${n} ${word}${n !== 1 ? 's' : ''})`;

      render(allDisplay, filteredIds, orderedKeywords, macros);
      updateFilterBadge();
    };

    // ── Render ────────────────────────────────────────────────────────────

    const render = (cards, filteredIds, keywords, macros) => {
      const nameFilter = normalize(el.name.value);
      const showCardBack = view === 'cards' && (
        checkedIds.has(CARD_BACK.id) ||
        (nameFilter && (nameFilter === 'back' || nameFilter === 'card back' || nameFilter === 'cardback'))
      );

      if (!cards.length && !showCardBack && view !== 'keywords' && view !== 'macros') {
        el.empty.style.display    = 'block';
        el.gallery.innerHTML      = '';
        el.cardsWrap.innerHTML    = '';
        el.tableBody.innerHTML    = '';
        return;
      }
      el.empty.style.display = 'none';

      if (view === 'gallery') {
        el.gallery.innerHTML = cards.map(c => {
          const kws = Array.isArray(c.keywords)
            ? c.keywords.filter(k => k != null && k !== '')
            : (c.keywords ? [c.keywords] : []);

          const keywordsHtml = kws.map(kw => {
            const kwData      = allKeywords.find(k => k.name === kw);
            const displayName = escapeHtml(kwData ? kwData.displayName : kw);
            const rawDesc = kwData ? kwData.description : '';
            const description = escapeHtml(resolveTypeTokens(rawDesc, c.type));
            return `<span title="${displayName} – ${description}">${displayName}</span>`;
          }).join(', ');

          const isChecked = checkedIds.has(c.id);
          const isPinned  = isChecked && !filteredIds.has(c.id);

          return `
      <article class="card${isChecked ? ' selected' : ''}${isPinned ? ' pinned' : ''}" data-id="${c.id}" data-alt-arts="${c.altArts || 0}" aria-label="Card ${escapeHtml(c.name)}">
        <img alt="${escapeHtml(c.name)}" src="${cardArtPath(c)}" loading="lazy" onerror="this.src=''; this.style.height='0';" />
        <div class="meta">
          <div><strong>#${c.id}</strong> — ${escapeHtml(c.name)}</div>
          <div class="kv">type: ${escapeHtml(capitalize(c.type))} • power: ${formatPower(c.power)}</div>
          <div class="kv">keywords: ${keywordsHtml || '—'}</div>
          <div class="kv">releaseYear: ${c.releaseYear ?? '-'}</div>
        </div>
      </article>
    `;
        }).join('');

      } else if (view === 'cards') {
        const displayCards = showCardBack ? [CARD_BACK, ...cards] : cards;
        el.cardsWrap.innerHTML = displayCards.map(c => {
          const isSelected = checkedIds.has(c.id);
          const av = galleryArtVersions[c.id] || 1;
          const altLabel = (c.altArts && av > 1) ? ` (Alt ${av - 1}/${c.altArts})` : '';
          return `
      <div class="card-img-item${isSelected ? ' selected' : ''}" data-id="${c.id}" title="${escapeHtml(c.name)}${escapeHtml(altLabel)}">
        <img alt="${escapeHtml(c.name)}" src="${cardFinalPath(c)}" loading="lazy" onerror="this.style.display='none';" draggable="false" />
      </div>
    `;
        }).join('');

      } else if (view === 'table') {
        el.tableBody.innerHTML = cards.map(c => {
          const kws = Array.isArray(c.keywords) ? c.keywords : (c.keywords ? [c.keywords] : []);
          const displayNames = kws.map(kw => {
            const kwData = allKeywords.find(k => k.name === kw);
            return kwData ? kwData.displayName : kw;
          });
          return `
          <tr>
            <td>${c.id}</td>
            <td>${escapeHtml(c.name)}</td>
            <td>${escapeHtml(capitalize(c.type))}</td>
            <td>${formatPower(c.power)}</td>
            <td>${displayNames.map(escapeHtml).join(', ')}</td>
            <td>${c.releaseYear ?? '-'}</td>
          </tr>
        `;
        }).join('');

      } else if (view === 'keywords') {
        el.keywordsBody.innerHTML = keywords.map(k => `
          <tr>
            <td>${k.id}</td>
            <td>${escapeHtml(k.displayName)}</td>
            <td>${escapeHtml(k.description)}</td>
            <td>${k.cardsWith}</td>
            <td>${escapeHtml(k.types)}</td>
          </tr>
        `).join('');
      } else if (view === 'macros') {
        el.macrosBody.innerHTML = macros.map(m => {
          if (!m.name) {
            return `<tr><td colspan="9"><hr></td></tr>`;
          }
          return `
          <tr>
            <td>${m.name}</td>
            <td>${m.total}</td>
            <td>${m.totalPercentage}</td>
            <td>${m.rock}</td>
            <td>${m.rockPercentage}</td>
            <td>${m.paper}</td>
            <td>${m.paperPercentage}</td>
            <td>${m.scissors}</td>
            <td>${m.scissorsPercentage}</td>
          </tr>
        `;
        }).join('');
      }
    };

    // ── Gallery click on image → toggle selected ──────────────────────────

    el.gallery.addEventListener('click', (e) => {
      if (e.target.tagName !== 'IMG') return;
      const article = e.target.closest('article.card[data-id]');
      if (!article) return;
      const id = Number(article.dataset.id);
      if (checkedIds.has(id)) { checkedIds.delete(id); } else { checkedIds.add(id); }
      updateBulkBar();
      filterCards();
    });

    el.gallery.addEventListener('auxclick', (e) => {
      if (e.button !== 1) return;
      e.preventDefault();
      const article = e.target.closest('article.card[data-id]');
      if (!article) return;
      const id = Number(article.dataset.id);
      const card = allCards.find(c => c.id === id);
      if (!card || !card.altArts) return;
      const maxV = card.altArts + 1;
      const cur = galleryArtVersions[id] || 1;
      galleryArtVersions[id] = (cur % maxV) + 1;
      filterCards();
    });

    // ── Cards tab click → toggle selected ────────────────────────────────

    el.cardsWrap.addEventListener('click', (e) => {
      const item = e.target.closest('.card-img-item[data-id]');
      if (!item) return;
      const id = Number(item.dataset.id);
      if (checkedIds.has(id)) { checkedIds.delete(id); } else { checkedIds.add(id); }
      updateBulkBar();
      filterCards();
    });

    el.cardsWrap.addEventListener('auxclick', (e) => {
      if (e.button !== 1) return;
      e.preventDefault();
      const item = e.target.closest('.card-img-item[data-id]');
      if (!item) return;
      const id = Number(item.dataset.id);
      const card = allCards.find(c => c.id === id);
      if (!card || !card.altArts) return;
      const maxV = card.altArts + 1;
      const cur = galleryArtVersions[id] || 1;
      galleryArtVersions[id] = (cur % maxV) + 1;
      filterCards();
    });

    // ── Filter controls ───────────────────────────────────────────────────

    [el.name, el.keywords].forEach(ctrl => {
      ctrl.addEventListener('input', () => { controlsToURL(); filterCards(); });
    });
    [el.type, el.power, el.powerIs, el.kwCount, el.keyword, el.expansion, el.releaseYear, el.orderBy, el.direction].forEach(ctrl => {
      ctrl.addEventListener('change', () => { syncPowerIsVisibility(); controlsToURL(); filterCards(); });
    });

    el.clear.addEventListener('click', () => {
      el.name.value        = '';
      el.keywords.value    = '';
      el.type.value        = '';
      el.power.value       = '';
      el.powerIs.value     = 'eq';
      syncPowerIsVisibility();
      el.kwCount.value     = '';
      el.keyword.value     = '';
      el.expansion.value   = '';
      el.releaseYear.value = '';
      el.decklist.value    = '';
      decklistCardIds      = null;
      el.orderBy.value     = 'oldest';
      el.direction.value   = 'asc';
      controlsToURL();
      filterCards();
    });

    el.galleryBtn.addEventListener('click',  () => { view = 'gallery';  ensureViewButtons(); controlsToURL(); filterCards(); });
    el.cardsBtn.addEventListener('click',    () => { view = 'cards';    ensureViewButtons(); controlsToURL(); filterCards(); });
    el.tableBtn.addEventListener('click',    () => { view = 'table';    ensureViewButtons(); controlsToURL(); filterCards(); });
    el.keywordsBtn.addEventListener('click', () => { view = 'keywords'; ensureViewButtons(); controlsToURL(); filterCards(); });
    el.macrosBtn.addEventListener('click',   () => { view = 'macros';   ensureViewButtons(); controlsToURL(); filterCards(); });
    el.rulesBtn.addEventListener('click',    () => { view = 'rules';    ensureViewButtons(); controlsToURL(); filterCards(); });

    // ── Decklist filter ───────────────────────────────────────────────────

    const loadDeckCardIds = async (deckId) => {
      const authToken = localStorage.getItem('authToken');
      if (!authToken || !deckId) { decklistCardIds = null; return; }
      try {
        const res = await fetch(DECKS_URL + '?id=' + deckId, {
          headers: { 'Authorization': 'Bearer ' + authToken },
        });
        if (!res.ok) { decklistCardIds = null; return; }
        const data = await res.json();
        decklistCardIds = new Set((data.cards || []).map(c => c.cardId));
      } catch (_) { decklistCardIds = null; }
    };

    const loadDecksForFilter = async () => {
      const authToken = localStorage.getItem('authToken');
      if (!authToken) return;
      try {
        const res = await fetch(DECKS_URL, {
          headers: { 'Authorization': 'Bearer ' + authToken },
        });
        if (!res.ok) return;
        const data = await res.json();
        const decks = Array.isArray(data) ? data : (data.decks || []);
        if (!decks.length) return;
        el.decklistWrap.style.display = '';
        const currentId = qs.get('decklist') ? Number(qs.get('decklist')) : '';
        el.decklist.innerHTML = '<option value="">Any</option>' +
          decks.map(d => `<option value="${d.id}">${escapeHtml(d.name)} (${d.totalCards || 0}/60)</option>`).join('');
        if (currentId) {
          el.decklist.value = currentId;
          await loadDeckCardIds(currentId);
        }
      } catch (_) {}
    };

    el.decklist.addEventListener('change', async () => {
      const deckId = el.decklist.value ? Number(el.decklist.value) : null;
      await loadDeckCardIds(deckId);
      controlsToURL();
      filterCards();
    });

    // ── Initial load ──────────────────────────────────────────────────────

    (async function init() {
      applyURLToControls();
      ensureViewButtons();
      RulesModule.init(el.rulesWrap);
      try {
        const res = await fetch(EXPANSIONS_URL);
        if (res.ok) {
          const data = await res.json();
          expansions = data.expansions || [];
        }
      } catch (_) { /* API unavailable → expansions stays [] → all cards treated as released */ }
      try {
        const res = await fetch(CARDS_URL, { method: 'GET' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        allCards = Array.isArray(data) ? data : (data.cards || []);
        calculateMacros();
        const currentExpansion = qs.get('expansion') ? Number(qs.get('expansion')) : '';
        el.expansion.innerHTML = '<option value="">Any</option>' +
          expansions
            .filter(e => getExpansionStatus(e) !== 'null')
            .map((e, i) => `<option value="${e.id}">${escapeHtml(e.name || 'Set ' + (i + 1))}</option>`)
            .join('');
        if (currentExpansion) el.expansion.value = currentExpansion;
      } catch (err) {
        showToast('Failed to load cards. Please try refreshing.');
        allCards = [];
      }
      await loadDecksForFilter();
      try {
        const res = await fetch(KEYWORDS_URL, { method: 'GET' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const rawKeywords = Array.isArray(data) ? data : (data.keywords || []);
        allKeywords = rawKeywords.map(keyword => {
          const cardsWith = allCards.filter(card => card.keywords.includes(keyword.name));
          const types = cardsWith.reduce((acc, card) => {
            const t = capitalize(card.type);
            if (!acc.includes(t)) acc.push(t);
            return acc;
          }, []);
          return {
            ...keyword,
            cardsWith: cardsWith.length,
            types: types.sort((a, b) => getTypeOrder(a) - getTypeOrder(b)).join(', '),
          };
        });
        const sorted = [...allKeywords].sort((a, b) => a.displayName.localeCompare(b.displayName));
        const current = qs.get('keyword') || '';
        const sortedWithVanilla = [...sorted, { name: 'vanilla', displayName: 'Vanilla' }]
          .sort((a, b) => a.displayName.localeCompare(b.displayName));
        el.keyword.innerHTML = '<option value="">Any</option>' +
          sortedWithVanilla.map(k => `<option value="${escapeHtml(k.name)}">${escapeHtml(k.displayName)}</option>`).join('');
        if (current) el.keyword.value = current;
      } catch (err) {
        showToast('Failed to load keywords. Please try refreshing.');
        allKeywords = [];
      }
      controlsToURL();
      filterCards();
    })();
  })();

  const addTableExport = (id, fileName) => {
    const btn = document.getElementById(id);
    if (!btn) return;
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      const table = btn.closest('table');
      if (!table) return;
      const rows = Array.from(table.rows);
      const csvLines = rows.map((row, i) => {
        const cells = i === 0 ? Array.from(row.cells).slice(0, -1) : Array.from(row.cells);
        return cells.map(cell => `"${cell.innerText.replace(/"/g, '""')}"`).join(',');
      });
      const blob = new Blob([csvLines.join('\n')], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fileName; a.click();
      URL.revokeObjectURL(url);
    });
  };
  addTableExport('export-btn', 'is-back-cards.csv');
  addTableExport('keywords-export-btn', 'is-back-keywords.csv');
  addTableExport('macros-export-btn', 'is-back-macros.csv');
</script>
</body>
</html>
