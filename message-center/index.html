<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message Center – Rakuel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@300;500&family=Material+Icons&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #111;
      color: #fff;
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 2rem;
      background-color: rgba(0,0,0,0.8);
      border-bottom: 2px solid #00ffcc;
    }
    header h1 {
      font-family: 'Anton', sans-serif;
      color: #00ffcc;
      margin: 0;
      font-size: 1.8rem;
    }
    header a {
      color: #00ffcc;
      text-decoration: none;
      font-size: 0.9rem;
    }
    header a:hover { text-decoration: underline; }

    #auth-error {
      max-width: 600px;
      margin: 4rem auto;
      text-align: center;
      color: #ff6688;
      font-size: 1.2rem;
    }
    #auth-error a { color: #00ffcc; }

    .filters {
      max-width: 900px;
      margin: 1.5rem auto 0;
      padding: 1rem 1.5rem;
      background: #1a1a1a;
      border-radius: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 2rem;
      align-items: flex-end;
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .filter-group label {
      font-size: 0.78rem;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .filters input[type="date"] {
      background: #222;
      border: 1px solid #444;
      border-radius: 5px;
      color: #fff;
      padding: 0.4rem 0.6rem;
      font-size: 0.9rem;
    }
    .filter-checks {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.2rem;
      align-items: center;
    }
    .filter-checks label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.9rem;
      cursor: pointer;
      color: #ccc;
    }
    .filter-checks input[type="checkbox"] { accent-color: #00ffcc; cursor: pointer; }
    .filter-btn {
      padding: 0.45rem 1.2rem;
      background: #00ffcc;
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .filter-btn:hover { background: #00ccaa; }

    #stats {
      max-width: 900px;
      margin: 0.8rem auto 0;
      padding: 0 1.5rem;
      color: #888;
      font-size: 0.85rem;
    }

    #messages-list {
      max-width: 900px;
      margin: 0.8rem auto 3rem;
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .msg-card {
      background: #1a1a1a;
      border-radius: 10px;
      padding: 1rem 1.2rem;
      border-left: 4px solid #444;
      transition: border-color 0.2s;
    }
    .msg-card.unread  { border-left-color: #00ffcc; }
    .msg-card.starred { border-left-color: #ffcc00; }
    .msg-card.spam    { border-left-color: #ff6600; opacity: 0.7; }
    .msg-card.deleted { border-left-color: #555; opacity: 0.5; }

    .msg-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.5rem;
    }
    .msg-email {
      font-weight: bold;
      color: #00ffcc;
      font-size: 0.95rem;
    }
    .msg-date {
      color: #888;
      font-size: 0.82rem;
    }
    .msg-badges {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
    }
    .badge {
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 20px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-unread  { background: #00ffcc; color: #000; }
    .badge-starred { background: #ffcc00; color: #000; }
    .badge-spam    { background: #ff6600; color: #fff; }
    .badge-deleted { background: #555; color: #ccc; }

    .msg-body {
      color: #ddd;
      font-size: 0.92rem;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }
    .msg-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.8rem;
    }
    .action-btn {
      padding: 0.3rem 0.8rem;
      border-radius: 5px;
      border: 1px solid #444;
      background: #222;
      color: #ccc;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .action-btn:hover { background: #333; color: #fff; }
    .action-btn.active { background: #00ffcc; color: #000; border-color: #00ffcc; }
    .action-btn.danger { border-color: #ff4466; color: #ff4466; }
    .action-btn.danger:hover { background: #ff4466; color: #fff; }
    .action-btn.warn { border-color: #ff6600; color: #ff6600; }
    .action-btn.warn:hover { background: #ff6600; color: #fff; }
    .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #empty-state {
      text-align: center;
      color: #666;
      padding: 3rem;
      font-size: 1.1rem;
    }
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: #1a1a1a;
      border: 1px solid #00ffcc;
      color: #fff;
      padding: 0.7rem 1.2rem;
      border-radius: 8px;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 100;
    }
    .toast.show { opacity: 1; }
    .toast.error { border-color: #ff4466; }
  </style>
</head>
<body>

<header>
  <a href="/" style="background:linear-gradient(90deg,#ff0066,#ff6600); color:#fff; padding:0.5rem 1.1rem; border-radius:8px; font-weight:bold; text-decoration:none; box-shadow:0 0 10px #ff0066; font-size:0.9rem; transition:transform 0.2s, box-shadow 0.2s;" onmouseover="this.style.transform='scale(1.05)';this.style.boxShadow='0 0 20px #ff0066'" onmouseout="this.style.transform='';this.style.boxShadow='0 0 10px #ff0066'">Home</a>
  <h1>Message Center</h1>
  <div></div>
</header>

<div id="auth-error" style="display:none;">
  Ei oikeuksia. <a href="/is-back/register">Kirjaudu sisään</a> admin-tunnuksilla.
</div>

<div id="app" style="display:none;">
  <div class="filters">
    <div class="filter-group">
      <label>Alkaen</label>
      <input type="date" id="dateFrom" />
    </div>
    <div class="filter-group">
      <label>Päättyen</label>
      <input type="date" id="dateTo" />
    </div>
    <div class="filter-checks">
      <label><input type="checkbox" id="showSpam" /> Näytä roskaposti</label>
      <label><input type="checkbox" id="showDeleted" /> Näytä poistetut</label>
      <label><input type="checkbox" id="starredOnly" /> Vain tähditetyt</label>
    </div>
    <button class="filter-btn" onclick="loadMessages()">Hae</button>
    <button class="filter-btn" style="background:#222;color:#aaa;border:1px solid #444;" onclick="resetFilters()">Nollaa</button>
  </div>

  <div id="stats"></div>
  <div id="messages-list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API = '/api/admin/messages';
  const token = localStorage.getItem('authToken');
  let currentMessages = [];

  async function init() {
    if (!token) { showAuthError(); return; }
    const res = await fetch(API + '?countOnly=true', { headers: authHeader() });
    if (res.status === 401 || res.status === 403) { showAuthError(); return; }
    document.getElementById('app').style.display = '';
    setDefaultDates();
    loadMessages();
  }

  function showAuthError() {
    document.getElementById('auth-error').style.display = '';
  }

  function authHeader() {
    return { 'Authorization': 'Bearer ' + token };
  }

  function setDefaultDates() {
    const today = new Date();
    const month = new Date();
    month.setDate(today.getDate() - 30);
    document.getElementById('dateTo').value = today.toISOString().slice(0, 10);
    document.getElementById('dateFrom').value = month.toISOString().slice(0, 10);
  }

  function resetFilters() {
    document.getElementById('showSpam').checked = false;
    document.getElementById('showDeleted').checked = false;
    document.getElementById('starredOnly').checked = false;
    setDefaultDates();
    loadMessages();
  }

  async function loadMessages() {
    const params = new URLSearchParams({
      showSpam:    document.getElementById('showSpam').checked ? '1' : '0',
      showDeleted: document.getElementById('showDeleted').checked ? '1' : '0',
      starredOnly: document.getElementById('starredOnly').checked ? '1' : '0',
    });
    const df = document.getElementById('dateFrom').value;
    const dt = document.getElementById('dateTo').value;
    if (df) params.set('dateFrom', df);
    if (dt) params.set('dateTo', dt);

    const res = await fetch(API + '?' + params, { headers: authHeader() });
    if (!res.ok) { showToast('Virhe haettaessa viestejä', true); return; }
    const data = await res.json();
    currentMessages = data.messages;
    renderMessages();
  }

  function renderMessages() {
    const list = document.getElementById('messages-list');
    const stats = document.getElementById('stats');
    const msgs = currentMessages;

    const unreadCount = msgs.filter(m => !m.isRead && !m.isSpam && !m.isDeleted).length;
    stats.textContent = `${msgs.length} viestiä — ${unreadCount} lukematta`;

    if (!msgs.length) {
      list.innerHTML = '<div id="empty-state">Ei viestejä</div>';
      return;
    }

    list.innerHTML = msgs.map(m => {
      const cardClass = [
        m.isDeleted ? 'deleted' : '',
        m.isSpam ? 'spam' : '',
        m.isStarred ? 'starred' : '',
        (!m.isRead && !m.isSpam && !m.isDeleted) ? 'unread' : '',
      ].filter(Boolean).join(' ');

      const badges = [
        (!m.isRead && !m.isSpam && !m.isDeleted) ? '<span class="badge badge-unread">Uusi</span>' : '',
        m.isStarred ? '<span class="badge badge-starred">★ Tähditetty</span>' : '',
        m.isSpam    ? '<span class="badge badge-spam">Roskaposti</span>' : '',
        m.isDeleted ? '<span class="badge badge-deleted">Poistettu</span>' : '',
      ].filter(Boolean).join('');

      const date = new Date(m.sendDate).toLocaleString('fi-FI');
      const starLabel = m.isStarred ? 'Poista tähti' : '★ Tähditä';
      const readLabel = m.isRead ? 'Merkitse lukemattomaksi' : '✓ Merkitse luetuksi';
      const starredGuard = m.isStarred ? 'disabled title="Poista tähti ensin"' : '';

      return `
        <div class="msg-card ${cardClass}" id="card-${m.id}">
          <div class="msg-header">
            <span class="msg-email">${esc(m.email)}</span>
            <span class="msg-date">${esc(date)}</span>
          </div>
          <div class="msg-badges">${badges}</div>
          <div class="msg-body">${esc(m.message)}</div>
          <div class="msg-actions">
            <button class="action-btn ${m.isRead ? '' : 'active'}" onclick="update(${m.id}, {isRead: ${!m.isRead}})">${readLabel}</button>
            <button class="action-btn ${m.isStarred ? 'active' : ''}" onclick="update(${m.id}, {isStarred: ${!m.isStarred}})">${starLabel}</button>
            ${!m.isSpam
              ? `<button class="action-btn warn" ${starredGuard} onclick="update(${m.id}, {isSpam: true})">Roskaposti</button>`
              : `<button class="action-btn" onclick="update(${m.id}, {isSpam: false})">Ei roskaposti</button>`
            }
            ${!m.isDeleted
              ? `<button class="action-btn danger" ${starredGuard} onclick="update(${m.id}, {isDeleted: true})">Poista</button>`
              : `<button class="action-btn" onclick="update(${m.id}, {isDeleted: false})">Palauta</button>`
            }
          </div>
        </div>`;
    }).join('');
  }

  async function update(id, fields) {
    const res = await fetch(API, {
      method: 'PUT',
      headers: { ...authHeader(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, ...fields }),
    });
    const data = await res.json();
    if (!res.ok) { showToast(data.error || 'Virhe', true); return; }

    const msg = currentMessages.find(m => m.id === id);
    if (msg) Object.assign(msg, fields);
    renderMessages();
    showToast('Tallennettu');
  }

  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  let toastTimer;
  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.className = 'toast', 2500);
  }

  init();
</script>
</body>
</html>
