<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="../favicon.svg" type="image/svg+xml" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Translation Merger</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/components/topbar.css">
<script src="/components/topbar.js" defer></script>

<style>
:root{
    --bg:#0f0f0f;
    --ink:#fff;
    --accent:#00ffcc;
    --accent2:#00ccff;
    --danger:#ff0033;
    --panel:#1e1e1e;
}

body{
    margin:0;
    font-family:'Roboto Mono', monospace;
    background:#0f0f0f;
    color:#fff;
    padding:2rem;
    background-image: radial-gradient(#333 1px, transparent 1px);
    background-size:20px 20px;
}

.subtitle{
    font-size:13px;
    color:#aaa;
    margin:0 0 20px;
}

.grid{
    display:grid;
    gap:16px;
}

@media(min-width:1000px){
    .grid{grid-template-columns:1fr 1fr 1fr;}
}

.card{
    background:var(--panel);
    border:2px solid var(--accent);
    border-radius:14px;
    padding:14px;
    box-shadow:0 0 20px rgba(0,255,204,0.08);
}

textarea{
    width:100%;
    height:300px;
    background:#0f0f0f;
    color:#e6db74;
    border:1px solid #333;
    border-radius:10px;
    padding:10px;
    font-family:'Roboto Mono';
    overflow:auto;
    white-space:pre;
    resize:vertical;
}

.card button{
    margin-bottom:10px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:1rem;
    flex-wrap:wrap;
}

.action-row{
    display:flex;
    gap:10px;
    margin-bottom:10px;
    flex-wrap:wrap;
}

button{
    padding:10px 18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:all .18s ease;
}

button:hover{
    transform:translateY(-1px);
    box-shadow:0 0 18px rgba(0,255,204,0.25);
}

button:disabled{
    opacity:0.4;
    cursor:not-allowed;
}

.secondary{
    background:#333;
    color:#fff;
}

.mode-btn{
    background:#333;
    color:#aaa;
    border:2px solid transparent;
    border-radius:10px;
    padding:8px 16px;
    font-weight:bold;
    cursor:pointer;
    transition:all .18s ease;
}

.mode-btn.active{
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#000;
    border-color:transparent;
}

.file-row{
    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;
}

.file-label{
    font-size:13px;
    color:#aaa;
}

.danger{
    background:#ff3366;
    color:#fff;
}

.copy-btn{
    background:#171717;
    color:#fff;
    border:1px solid #333;
    display:flex;
    align-items:center;
    gap:8px;
    min-width:120px;
    justify-content:center;
}

.copy-btn svg{
    width:16px;
    height:16px;
}

.copy-btn.copied{
    background:linear-gradient(90deg,#00ffcc,#00cc88);
    color:#000;
}

.list{
    max-height:250px;
    overflow:auto;
    border:1px solid #333;
    padding:8px;
    border-radius:8px;
}

.item{
    display:flex;
    flex-direction:column;
    gap:4px;
    margin-bottom:8px;
    border-bottom:1px solid #333;
    padding-bottom:6px;
}

.controls{
    margin-bottom:10px;
}

.loading{
    display:none;
    text-align:center;
    margin:1rem 0;
}

.bar{
    height:6px;
    background:var(--accent);
    width:0%;
    transition:width .3s;
}

.wrap{
    background:#222;
    border-radius:6px;
    overflow:hidden;
}

.small{
    font-size:12px;
    color:#aaa;
}

.ready-panel{
    margin-top:20px;
    display:none;
}

.ready-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
}

.ready-badge{
    padding:8px 14px;
    border-radius:999px;
    background:rgba(0,255,204,0.15);
    border:1px solid rgba(0,255,204,0.35);
    color:var(--accent);
    font-size:13px;
}

.change-log{
    margin-top:14px;
    border-top:1px solid #333;
    padding-top:12px;
}

.change-entry{
    padding:10px;
    background:#121212;
    border-radius:10px;
    margin-bottom:10px;
    border:1px solid #2d2d2d;
}

.change-type{
    color:var(--accent);
    font-size:12px;
    margin-bottom:4px;
}

.step-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
}

.eye-btn{
    background:transparent;
    border:none;
    padding:4px 6px;
    color:var(--accent);
    cursor:pointer;
    display:flex;
    align-items:center;
    filter:drop-shadow(0 0 5px var(--accent));
    transition:all .18s ease;
    font-weight:normal;
    border-radius:6px;
}

.eye-btn:hover{
    transform:scale(1.15);
    filter:drop-shadow(0 0 10px var(--accent));
    box-shadow:none;
}

.eye-btn .eye-closed{
    display:none;
}

.eye-btn.active .eye-open{
    display:none;
}

.eye-btn.active .eye-closed{
    display:block;
}

.json-preview{
    margin-top:12px;
    border-top:1px solid #333;
    padding-top:10px;
}

.json-preview textarea{
    height:200px;
    margin-bottom:8px;
}

.json-preview-actions{
    display:flex;
    gap:8px;
    margin-bottom:8px;
}
</style>
</head>

<body>

<rk-topbar title="Translation Merger"></rk-topbar>
<div class="subtitle">Merge and review JSON conflicts visually</div>

<div class="buttons">
    <div style="display:flex;gap:8px;margin-bottom:10px;">
        <button class="mode-btn active" id="modeConflict" onclick="setMode('conflict')">Conflict File</button>
        <button class="mode-btn" id="modeTwo" onclick="setMode('two')">Two Files</button>
    </div>

    <div id="inputConflict" class="file-row">
        <span class="file-label">Conflict file:</span>
        <input type="file" id="fileInput" />
    </div>

    <div id="inputTwo" class="file-row" style="display:none;">
        <span class="file-label">Current:</span>
        <input type="file" id="fileA" />
        <span class="file-label">Merged:</span>
        <input type="file" id="fileB" />
    </div>

    <div style="display:flex;gap:10px;margin-top:10px;">
        <button id="processBtn">Process</button>
        <button id="resetBtn" class="secondary">Reset</button>
    </div>
</div>

<div class="loading" id="loading">
    <div>Reading & parsing...</div>
    <div class="wrap"><div class="bar" id="bar"></div></div>
</div>

<div class="grid">
    <div class="card">
        <h3>Current</h3>
        <div class="action-row">
            <button onclick="download('current')">Download</button>
            <button class="copy-btn" onclick="copyJson('current', this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span>Copy</span>
            </button>
        </div>
        <textarea id="current"></textarea>
    </div>

    <div class="card">
        <h3>Result</h3>
        <div class="action-row">
            <button onclick="download('result')">Download</button>
            <button class="copy-btn" onclick="copyJson('result', this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span>Copy</span>
            </button>
        </div>
        <textarea id="result"></textarea>
    </div>

    <div class="card">
        <h3>Merged</h3>
        <div class="action-row">
            <button onclick="download('merged')">Download</button>
            <button class="copy-btn" onclick="copyJson('merged', this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span>Copy</span>
            </button>
        </div>
        <textarea id="merged"></textarea>
    </div>
</div>

<div class="card" style="margin-top:20px;">
    <div class="step-header">
        <h3 id="phase1Title" style="margin:0;">Step 1: Changed values</h3>
        <button class="eye-btn" id="eyeBtn1" onclick="toggleJsonView(1)" title="View in json">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
        </button>
    </div>
    <div class="controls">
        <button id="selAll1" onclick="toggleAll(true)">Select All</button>
        <button id="unselAll1" onclick="toggleAll(false)">Unselect All</button>
    </div>
    <div id="changes" class="list"></div>
    <div id="jsonView1" class="json-preview" style="display:none;">
        <div class="json-preview-actions">
            <button onclick="downloadSelectionJson(1)">Download</button>
            <button class="copy-btn" onclick="copySelectionJson(1, this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                <span>Copy</span>
            </button>
        </div>
        <textarea id="selectionJson1" readonly></textarea>
    </div>
</div>

<div class="card" style="margin-top:20px;">
    <div class="step-header">
        <h3 id="phase2Title" style="margin:0;">Step 2: New fields</h3>
        <button class="eye-btn" id="eyeBtn2" onclick="toggleJsonView(2)" title="View in json">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
        </button>
    </div>
    <div class="controls">
        <button id="selAll2" onclick="toggleAllNew(true)">Select All</button>
        <button id="unselAll2" onclick="toggleAllNew(false)">Unselect All</button>
    </div>
    <div id="newFields" class="list"></div>
    <div id="jsonView2" class="json-preview" style="display:none;">
        <div class="json-preview-actions">
            <button onclick="downloadSelectionJson(2)">Download</button>
            <button class="copy-btn" onclick="copySelectionJson(2, this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                <span>Copy</span>
            </button>
        </div>
        <textarea id="selectionJson2" readonly></textarea>
    </div>
</div>

<div class="card ready-panel" id="readyPanel">
    <div class="ready-header">
        <div>
            <h3 style="margin:0;">Ready after Step 2</h3>
            <div class="small">Final generated JSON and summary of applied changes</div>
        </div>

        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <div class="ready-badge">Ready</div>

            <button onclick="download('result')">Download Final JSON</button>

            <button class="copy-btn" onclick="copyJson('result', this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span>Copy Final JSON</span>
            </button>
        </div>
    </div>

    <textarea id="finalOnly" style="margin-top:14px;height:280px;"></textarea>

    <div class="change-log">
        <h4>Applied Changes</h4>
        <div id="changeLog"></div>
    </div>
</div>

<script>
const LS = {
    save:(k,v)=>localStorage.setItem(k,JSON.stringify(v)),
    load:(k)=>JSON.parse(localStorage.getItem(k)||"null")
};

let current={}, merged={}, result={};

function parseConflict(text){
    const lines=text.split("\n");
    let cur=[], mer=[];
    let mode=null;

    for(let l of lines){
        if(l.startsWith("<<<<<<<")){mode="cur";continue;}
        if(l.startsWith("=======")){mode="mer";continue;}
        if(l.startsWith(">>>>>>>")){mode=null;continue;}

        if(mode==="cur") cur.push(l);
        else if(mode==="mer") mer.push(l);
        else{
            cur.push(l);
            mer.push(l);
        }
    }

    return {
        current: JSON.parse(cur.join("\n")),
        merged: JSON.parse(mer.join("\n"))
    };
}

function sortObj(obj){
    if(typeof obj!=="object"||obj===null) return obj;

    return Object.keys(obj).sort().reduce((r,k)=>{
        r[k]=sortObj(obj[k]);
        return r;
    },{});
}

function flatten(obj,p="",res={}){
    for(let k in obj){
        let path=p? p+"."+k : k;

        if(typeof obj[k]==="object" && obj[k]!==null){
            flatten(obj[k],path,res);
        }else{
            res[path]=obj[k];
        }
    }

    return res;
}

function build(){
    const cFlat=flatten(current);
    const mFlat=flatten(merged);

    const changes=[];
    const additions=[];

    for(let k in cFlat){
        if(mFlat[k] !== undefined && mFlat[k]!==cFlat[k]){
            changes.push(k);
        }
    }

    for(let k in mFlat){
        if(!(k in cFlat)){
            additions.push(k);
        }
    }

    const changesDiv=document.getElementById("changes");
    const newDiv=document.getElementById("newFields");

    changesDiv.innerHTML="";
    newDiv.innerHTML="";

    changes.forEach(k=>{
        const el=document.createElement("div");
        el.className="item";
        el.innerHTML=`
            <label><input type="checkbox" data-k="${k}"> ${k}</label>
            <div class="small">Original: ${JSON.stringify(get(current,k))}</div>
            <div class="small">New: ${JSON.stringify(get(merged,k))}</div>
        `;
        changesDiv.appendChild(el);
    });

    additions.forEach(k=>{
        const el=document.createElement("div");
        el.className="item";
        el.innerHTML=`
            <label><input type="checkbox" data-new="${k}"> ${k}</label>
            <div class="small">Value: ${JSON.stringify(get(merged,k))}</div>
        `;
        newDiv.appendChild(el);
    });

    document.getElementById("phase1Title").innerText = `Step 1: Changed values (${changes.length})`;
    document.getElementById("phase2Title").innerText = `Step 2: New fields (${additions.length})`;

    document.getElementById("selAll1").disabled = changes.length===0;
    document.getElementById("unselAll1").disabled = changes.length===0;
    document.getElementById("selAll2").disabled = additions.length===0;
    document.getElementById("unselAll2").disabled = additions.length===0;
}

function apply(){
    result=JSON.parse(JSON.stringify(current));

    const applied=[];

    document.querySelectorAll("[data-k]:checked").forEach(el=>{
        const k=el.dataset.k;
        const oldVal=get(current,k);
        const newVal=get(merged,k);

        set(result,k,newVal);

        applied.push({
            type:"Changed",
            key:k,
            from:oldVal,
            to:newVal
        });
    });

    document.querySelectorAll("[data-new]:checked").forEach(el=>{
        const k=el.dataset.new;
        const newVal=get(merged,k);

        set(result,k,newVal);

        applied.push({
            type:"Added",
            key:k,
            from:null,
            to:newVal
        });
    });

    const formatted=JSON.stringify(sortObj(result),null,2);

    document.getElementById("result").value=formatted;
    document.getElementById("finalOnly").value=formatted;

    updateChangeLog(applied);

    document.getElementById("readyPanel").style.display = Object.keys(current).length ? "block" : "none";

    updateSelectionJson(1);
    updateSelectionJson(2);

    LS.save("state",{current,merged,result});
}

function updateChangeLog(applied){
    const log=document.getElementById("changeLog");

    if(!applied.length){
        log.innerHTML='<div class="small">No changes selected yet.</div>';
        return;
    }

    log.innerHTML = applied.map(item => `
        <div class="change-entry">
            <div class="change-type">${item.type}</div>
            <strong>${item.key}</strong>
            <div class="small">From: ${JSON.stringify(item.from)}</div>
            <div class="small">To: ${JSON.stringify(item.to)}</div>
        </div>
    `).join("");
}

function get(obj,path){
    return path.split(".").reduce((o,k)=>o[k],obj);
}

function set(obj,path,val){
    const parts=path.split(".");
    let o=obj;

    parts.forEach((k,i)=>{
        if(i===parts.length-1) o[k]=val;
        else{
            if(!o[k]) o[k]={};
            o=o[k];
        }
    });
}

function toggleAll(v){
    document.querySelectorAll("#changes input").forEach(i=>i.checked=v);
    apply();
}

function toggleAllNew(v){
    document.querySelectorAll("#newFields input").forEach(i=>i.checked=v);
    apply();
}

async function copyJson(type, btn){
    const text=document.getElementById(type).value;

    try{
        await navigator.clipboard.writeText(text);

        const label=btn.querySelector("span");
        const original=label.innerText;

        btn.classList.add("copied");
        label.innerText="Copied";

        setTimeout(()=>{
            btn.classList.remove("copied");
            label.innerText=original.includes("Final") ? "Copy Final JSON" : "Copy";
        },1500);

    }catch(err){
        alert("Clipboard copy failed");
    }
}

function download(type){
    const data={current,merged,result}[type];

    const blob=new Blob([JSON.stringify(data,null,2)]);
    const a=document.createElement("a");

    a.href=URL.createObjectURL(blob);
    a.download=type+".json";
    a.click();
}

function animate(cb){
    const l=document.getElementById("loading");
    const bar=document.getElementById("bar");

    l.style.display="block";

    let w=0;

    const t=setInterval(()=>{
        w+=25;
        bar.style.width=w+"%";

        if(w>=100){
            clearInterval(t);

            setTimeout(()=>{
                l.style.display="none";
                cb();
            },200);
        }
    },150);
}

let currentMode="conflict";

function setMode(mode){
    currentMode=mode;
    document.getElementById("modeConflict").classList.toggle("active",mode==="conflict");
    document.getElementById("modeTwo").classList.toggle("active",mode==="two");
    document.getElementById("inputConflict").style.display=mode==="conflict"?"flex":"none";
    document.getElementById("inputTwo").style.display=mode==="two"?"flex":"none";
}

function readFile(file){
    return new Promise((resolve,reject)=>{
        const r=new FileReader();
        r.onload=()=>resolve(r.result);
        r.onerror=reject;
        r.readAsText(file);
    });
}

function loadData(cur,mer){
    current=sortObj(cur);
    merged=sortObj(mer);
    result=JSON.parse(JSON.stringify(current));

    document.getElementById("current").value=JSON.stringify(current,null,2);
    document.getElementById("merged").value=JSON.stringify(merged,null,2);
    document.getElementById("result").value=JSON.stringify(result,null,2);

    build();
    apply();
}

document.getElementById("processBtn").onclick=async()=>{
    if(currentMode==="conflict"){
        const file=document.getElementById("fileInput").files[0];
        if(!file) return alert("Upload a conflict file");

        const text=await readFile(file);
        animate(()=>{
            const parsed=parseConflict(text);
            loadData(parsed.current,parsed.merged);
        });
    } else {
        const fileA=document.getElementById("fileA").files[0];
        const fileB=document.getElementById("fileB").files[0];
        if(!fileA||!fileB) return alert("Upload both files");

        const [textA,textB]=await Promise.all([readFile(fileA),readFile(fileB)]);
        animate(()=>{
            loadData(JSON.parse(textA),JSON.parse(textB));
        });
    }
};

document.addEventListener("change",e=>{
    if(e.target.matches("input[type=checkbox]")){
        apply();
    }
});

document.getElementById("resetBtn").onclick=()=>{
    localStorage.clear();
    location.reload();
};

function buildSelectionJson(step){
    const obj={};
    if(step===1){
        document.querySelectorAll("#changes [data-k]:checked").forEach(el=>{
            set(obj,el.dataset.k,get(merged,el.dataset.k));
        });
    } else {
        document.querySelectorAll("#newFields [data-new]:checked").forEach(el=>{
            set(obj,el.dataset.new,get(merged,el.dataset.new));
        });
    }
    return JSON.stringify(sortObj(obj),null,2);
}

function updateSelectionJson(step){
    const view=document.getElementById(`jsonView${step}`);
    if(!view||view.style.display==="none") return;
    document.getElementById(`selectionJson${step}`).value=buildSelectionJson(step);
}

function toggleJsonView(step){
    const btn=document.getElementById(`eyeBtn${step}`);
    const view=document.getElementById(`jsonView${step}`);
    const isOpen=btn.classList.contains("active");
    if(isOpen){
        btn.classList.remove("active");
        btn.title="View in json";
        view.style.display="none";
    } else {
        btn.classList.add("active");
        btn.title="Hide json view";
        view.style.display="block";
        document.getElementById(`selectionJson${step}`).value=buildSelectionJson(step);
    }
}

function downloadSelectionJson(step){
    const text=buildSelectionJson(step);
    const blob=new Blob([text]);
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`step${step}-selection.json`;
    a.click();
}

async function copySelectionJson(step,btn){
    const text=buildSelectionJson(step);
    try{
        await navigator.clipboard.writeText(text);
        const label=btn.querySelector("span");
        btn.classList.add("copied");
        label.innerText="Copied";
        setTimeout(()=>{
            btn.classList.remove("copied");
            label.innerText="Copy";
        },1500);
    } catch(err){
        alert("Clipboard copy failed");
    }
}

window.onload=()=>{
    const s=LS.load("state");

    if(s){
        current=s.current;
        merged=s.merged;
        result=s.result;

        document.getElementById("current").value=JSON.stringify(current,null,2);
        document.getElementById("merged").value=JSON.stringify(merged,null,2);
        document.getElementById("result").value=JSON.stringify(result,null,2);
        document.getElementById("finalOnly").value=JSON.stringify(result,null,2);

        build();
        apply();
    }
};
</script>
