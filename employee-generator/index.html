<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Employee Generator</title>

  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/components/topbar.css">
  <script src="/components/topbar.js" defer></script>
  <link rel="stylesheet" href="/components/footer.css">
  <script src="/components/footer.js" defer></script>

  <style>
    body {
      margin: 0;
      font-family: 'Roboto Mono', monospace;
      background-color: #0f0f0f;
      color: #fff;
      padding: 2rem;
      background-image: radial-gradient(#333 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .info-container {
      max-width: 660px;
      margin: auto;
    }

    .info-box {
      background-color: #1e1e1e;
      padding: 2.2rem;
      border-radius: 14px;
      border: 2px solid #00ffcc;
      box-shadow: 0 0 14px #00ffcc55;
    }

    /* ---- ROW LAYOUT ---- */
    .row {
      display: grid;
      grid-template-columns: 170px 1fr auto;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.1rem;
    }

    .label {
      color: #bfffe9;
    }

    /* ---- INPUTS ---- */
    select,
    input[type="number"] {
      width: 100%;
      height: 42px;
      font-size: 16px;
      padding: 6px 12px;
      font-family: inherit;
      background-color: #111;
      color: #00ffcc;
      border: 1px solid #00ffcc;
      border-radius: 10px;
    }

    select:focus,
    input:focus {
      outline: none;
      box-shadow: 0 0 10px #00ffcc;
    }

    /* Number arrows – modern look */
    input[type="number"]::-webkit-inner-spin-button {
      opacity: 1;
      margin-left: 10px;
      filter: invert(1) brightness(1.2);
    }

    hr {
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, #00ffcc, transparent);
      margin: 2.2rem 0 2rem; /* MORE bottom space */
    }

    /* ---- OUTPUT TEXT ---- */
    .value {
      word-break: break-all;
    }

    .copy-btn {
      background-color: #2b2b2b;
      color: #00ffcc;
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 14px;
    }

    .copy-btn:hover {
      background-color: #00ffcc;
      color: #000;
    }

    /* ---- REGENERATE BUTTON ---- */
    .regen-btn {
      margin-top: 2rem;
      width: 100%;
      background: linear-gradient(90deg, #ff0066, #ff6600);
      color: #fff;
      padding: 16px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 18px #ff006688;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .regen-btn span {
      color: #00ff66; /* GREEN ICON */
      font-size: 20px;
    }

    .regen-btn:hover {
      transform: scale(1.04);
      box-shadow: 0 0 26px #ff0066;
    }

  </style>
</head>

<body>

<rk-topbar title="Employee Generator"></rk-topbar>

<div class="info-container">
  <div class="info-box">

    <div class="row">
      <div class="label">Sukupuoli</div>
      <select id="sexSelect"></select>
      <div></div>
    </div>

    <div class="row">
      <div class="label">Syntymävuosi</div>
      <input type="number" id="yearInput">
      <div></div>
    </div>

    <hr>

    <div class="row">
      <div class="label">Etunimi</div>
      <div class="value" id="firstName"></div>
      <button class="copy-btn" onclick="copyText('firstName')">📎</button>
    </div>

    <div class="row">
      <div class="label">Sukunimi</div>
      <div class="value" id="lastName"></div>
      <button class="copy-btn" onclick="copyText('lastName')">📎</button>
    </div>

    <div class="row">
      <div class="label">Henkilötunnus</div>
      <div class="value" id="hetu"></div>
      <button class="copy-btn" onclick="copyText('hetu')">📎</button>
    </div>

    <div class="row">
      <div class="label">IBAN</div>
      <div class="value" id="iban"></div>
      <button class="copy-btn" onclick="copyText('iban')">📎</button>
    </div>

    <div class="row">
      <div class="label">BIC</div>
      <div class="value" id="bic"></div>
      <button class="copy-btn" onclick="copyText('bic')">📎</button>
    </div>

    <button class="regen-btn" onclick="regenerateAll()">
      <span>↻</span> REGENERATE
    </button>
  </div>
</div>

<script>
  const maleNames = ["Mikko","Juha","Antti","Pekka","Lauri","Jussi","Timo","Ville","Sami","Aleksi"];
  const femaleNames = ["Anna","Laura","Sari","Katja","Tiina","Emilia","Johanna","Maria","Elina","Aino"];
  const lastNames = ["Virtanen","Korhonen","Nieminen","Mäkinen","Hämäläinen","Laine","Heikkinen","Koski","Järvinen","Lehtonen"];
  const checksumChars = "0123456789ABCDEFHJKLMNPRSTUVWXY";
  const banks = [
    { bic: "NDEAFIHH", prefix: "10" }, // Nordea
    { bic: "OKOYFIHH", prefix: "50" }, // OP
    { bic: "DABAFIHH", prefix: "80" }, // Danske Bank
    { bic: "SBANFIHH", prefix: "39" }, // S-Pankki
  ];

  const rand = arr => arr[Math.floor(Math.random() * arr.length)];

  function randomYear() {
    const now = new Date().getFullYear();
    return Math.floor(Math.random() * 120) + (now - 120);
  }

  function generateHetu(sex, year) {
    const dd = String(Math.floor(Math.random() * 28) + 1).padStart(2,"0");
    const mm = String(Math.floor(Math.random() * 12) + 1).padStart(2,"0");
    const yy = String(year).slice(-2);
    const c = year < 1900 ? "+" : year < 2000 ? "-" : "A";

    let n;
    do {
      n = Math.floor(Math.random() * 900) + 100;
    } while ((sex === "Mies" && n % 2 === 0) || (sex === "Nainen" && n % 2 !== 0));

    const base = `${dd}${mm}${yy}${n}`;
    const check = checksumChars[parseInt(base,10) % 31];
    return `${dd}${mm}${yy}${c}${n}${check}`;
  }

  function generateFinnishIban(bank) {
    const restLen = 14 - bank.prefix.length;
    const rest = String(Math.floor(Math.random()*Math.pow(10,restLen))).padStart(restLen,"0");
    const bban = bank.prefix + rest;
    const r = bban + "FI00";
    const num = r.replace(/[A-Z]/g,c=>c.charCodeAt(0)-55);
    const mod = BigInt(num) % 97n;
    const cd = String(98n-mod).padStart(2,"0");
    return (`FI${cd}${bban}`).match(/.{1,4}/g).join(" ");
  }

  function populateSelectors(){
    sexSelect.innerHTML="";
    ["Mies","Nainen"].forEach(s=>{
      const o=document.createElement("option");
      o.value=s; o.textContent=s;
      sexSelect.appendChild(o);
    });
    sexSelect.value=Math.random()<0.5?"Mies":"Nainen";
    const now=new Date().getFullYear();
    yearInput.min=1; yearInput.max=now;
    yearInput.value=randomYear();
  }

  function regeneratePerson(){
    firstName.textContent = sexSelect.value==="Mies" ? rand(maleNames) : rand(femaleNames);
    lastName.textContent  = rand(lastNames);
    hetu.textContent      = generateHetu(sexSelect.value, +yearInput.value);
    const bank            = rand(banks);
    iban.textContent      = generateFinnishIban(bank);
    bic.textContent       = bank.bic;
  }

  function regenerateAll(){
    populateSelectors();
    regeneratePerson();
  }

  function copyText(id){
    navigator.clipboard.writeText(document.getElementById(id).innerText);
  }

  sexSelect.addEventListener("change", regeneratePerson);
  yearInput.addEventListener("change", regeneratePerson);
  window.addEventListener("DOMContentLoaded", regenerateAll);
</script>

<rk-footer></rk-footer>

</body>
</html>
